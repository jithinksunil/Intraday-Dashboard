<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #15181d; --muted: #68707d;
    --accent: #2f6fed; --up: #10895a; --down: #c8372d; --hot: #b45309; --hover: #f0f3f8; --avg: #9aa3b2; --tip-bg: #ffffff; --good: #0e8f8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #272d36; --text: #e8ebf0; --muted: #8b95a5;
      --accent: #6b9bff; --up: #3ecf8e; --down: #ff7a6e; --hot: #f5a524; --hover: #1e242c; --avg: #6a7484; --tip-bg: #1f252e; --good: #4fd1c5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.live::before { background: var(--up); }
  #status.down::before { background: var(--down); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  /* The header stays at the top while scrolling, and the stock list stays pinned just below it.
     --header-h is the header's measured height, kept current by the script. */
  header { position: sticky; top: 0; z-index: 10; }
  nav.panel { position: sticky; top: calc(var(--header-h, 57px) + 16px); align-self: start; max-height: calc(100vh - var(--header-h, 57px) - 32px); overflow-y: auto; }
  main.closed { grid-template-columns: 1fr; }
  main.closed nav { display: none; }
  .head-right { display: flex; align-items: center; gap: 18px; }
  .risk { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .risk-box { display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); }
  .risk-box:focus-within { border-color: var(--accent); }
  .risk input { width: 78px; border: 0; background: none; color: inherit; font: inherit; font-variant-numeric: tabular-nums; outline: none; }
  .ladder { display: grid; gap: 6px; margin: 4px 0 18px; }
  .ladder div { display: flex; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
  .ladder .t { border-left: 3px solid var(--up); } .ladder .e { border-left: 3px solid var(--accent); } .ladder .s { border-left: 3px solid var(--down); }
  .head-left { display: flex; align-items: center; gap: 12px; }
  #toggle { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  #toggle:hover { background: var(--hover); }
  #toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 16px 5px; color: var(--muted); font-size: 12px; font-weight: 600; }
  #list { list-style: none; margin: 0; padding: 6px; }
  #list button {
    width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    padding: 9px 10px; border: 0; border-radius: 7px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  #list button:hover { background: var(--hover); }
  #list button[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
  #list button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .name { font-weight: 600; }
  .exch { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .05em; line-height: 15px; vertical-align: middle; }
  h2 .exch { font-size: 11px; line-height: 17px; }
  .sub { color: var(--muted); font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .pill { min-width: 58px; text-align: right; font-weight: 600; }
  .pill.excellent { color: var(--up); }
  .pill.verygood { color: var(--good); }
  .pill.good { color: var(--accent); }
  .pill.average { color: var(--hot); }
  .pill.bad, .pill.none { color: var(--muted); font-weight: 500; }
  #detail { padding: 20px 22px; min-height: 420px; }
  #detail h2 { margin: 0; font-size: 20px; }
  .price { color: var(--muted); margin-top: 2px; }
  .hero { display: flex; align-items: baseline; gap: 12px; margin: 22px 0 4px; }
  .hero .big { font-size: 54px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; }
  .hero .label { color: var(--muted); }
  .verdict { margin: 0 0 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .chart-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; background: var(--accent); }
  .legend .avg::before { background: var(--avg); }
  svg { max-width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .l-avg { fill: none; stroke: var(--avg); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .l-today { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
  .l-vwap { fill: none; stroke: var(--hot); stroke-width: 1.5; }
  .legend .vw::before { background: var(--hot); }
  .l-buy { fill: none; stroke: var(--up); stroke-width: 2; stroke-linejoin: round; }
  .l-sell { fill: none; stroke: var(--down); stroke-width: 2; stroke-linejoin: round; }
  .legend .buy::before { background: var(--up); }
  .legend .sell::before { background: var(--down); }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .jump a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }
  .jump a:hover, .jump a:focus-visible { color: var(--text); border-color: var(--accent); outline: none; }
  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 0 0 6px; }
  .split .b { background: var(--up); } .split .a { background: var(--down); }
  .split-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  table.book { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.book th { color: var(--muted); font-size: 12px; font-weight: 500; padding: 4px 8px; text-align: right; }
  table.book td { padding: 5px 8px; text-align: right; position: relative; }
  table.book td.px { font-weight: 600; }
  table.book td.bid.px { color: var(--up); } table.book td.ask.px { color: var(--down); }
  table.book td.ask, table.book th.ask { text-align: left; }
  table.book .bar { position: absolute; top: 2px; bottom: 2px; opacity: 0.16; border-radius: 3px; }
  table.book td.bid .bar { right: 0; background: var(--up); } table.book td.ask .bar { left: 0; background: var(--down); }
  table.book td span { position: relative; }
  .tag { display: inline-block; font-size: 12px; color: var(--hot); border: 1px solid var(--hot); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  table.levels { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.levels th { color: var(--muted); font-size: 12px; font-weight: 500; padding: 4px 8px; text-align: right; }
  table.levels th:first-child, table.levels td:first-child { text-align: left; }
  table.levels td { padding: 6px 8px; text-align: right; border-top: 1px solid var(--line); }
  table.levels tr.now td { background: var(--hover); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .group { margin-top: 22px; }
  .group-title { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .group-title a { color: var(--muted); text-decoration: none; }
  .group-title a:hover, .group-title a:focus-visible { color: var(--accent); outline: none; }
  .tile { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .12s, background .12s; }
  .tile:hover { background: var(--hover); border-color: var(--accent); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile-title { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 600; }
  .tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin-top: 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile { position: relative; }
  .info { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; flex: none; border: 1px solid var(--muted); border-radius: 50%; font-size: 11px; font-weight: 700; font-style: italic; font-family: Georgia, serif; }
  .info { position: relative; }
  .info::after { content: ""; position: absolute; inset: -11px; }
  .info { transition: color .12s, border-color .12s, background .12s; }
  .info:hover, .info.on { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #tooltip { position: fixed; z-index: 20; width: max-content; max-width: min(360px, calc(100vw - 24px)); padding: 12px 14px 13px; border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 10px; background: var(--tip-bg); color: var(--text); box-shadow: 0 12px 32px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .2); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease; visibility: hidden; }
  #tooltip.show { opacity: 1; transform: none; visibility: visible; }
  #tooltip::before { content: ""; position: absolute; left: var(--arrow-x, 20px); width: 10px; height: 10px; background: var(--tip-bg); border-left: 1px solid var(--line); border-top: 2px solid var(--accent); transform: translateX(-50%) rotate(45deg); top: -7px; }
  #tooltip.above::before { top: auto; bottom: -6px; border: 0; border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
  #tooltip.above { border-top: 1px solid var(--line); border-bottom: 2px solid var(--accent); transform: translateY(-4px); }
  #tooltip.above.show { transform: none; }
  #tooltip .tt-kicker { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #tooltip .tt-title { font-size: 14px; font-weight: 650; margin: 2px 0 9px; }
  #tooltip .tt-eq { font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
  #tooltip .tt-eq + .tt-eq { margin-top: 6px; }
  #tooltip .tt-eq b { color: var(--accent); font-weight: 600; }
  #tooltip .tt-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  /* Two buttons per tile: "?" how to interpret, "i" how it's calculated. */
  .tile-title .icons { display: inline-flex; gap: 9px; flex: none; margin-left: 8px; }
  .icons .info::after { inset: -11px -4px; }
  .info.how { font-style: normal; font-family: inherit; font-size: 11.5px; }
  /* The interpretation tooltip is longer: wider, scrollable, and it can be touched and scrolled. */
  #tooltip.guide { width: min(440px, calc(100vw - 24px)); max-width: none; pointer-events: auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #tooltip.guide::before { display: none; }
  #tooltip .tt-h { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 12px 0 5px; }
  #tooltip .tt-title + .tt-h { margin-top: 0; }
  #tooltip .tt-p { margin: 0; font-size: 12.5px; line-height: 1.5; }
  #tooltip .tt-rows { margin: 0; display: grid; grid-template-columns: minmax(96px, 34%) 1fr; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-size: 12px; line-height: 1.45; }
  #tooltip .tt-rows dt, #tooltip .tt-rows dd { margin: 0; padding: 6px 9px; border-top: 1px solid var(--line); }
  #tooltip .tt-rows dt:first-of-type, #tooltip .tt-rows dt:first-of-type + dd { border-top: 0; }
  #tooltip .tt-rows dt { font-weight: 650; }
  #tooltip .tt-rows dd { color: var(--text); border-left: 1px solid var(--line); }
  #tooltip .tt-tags { border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-size: 12px; line-height: 1.45; }
  #tooltip .tt-tag { padding: 8px 9px; border-top: 1px solid var(--line); }
  #tooltip .tt-tag:first-child { border-top: 0; }
  #tooltip .tt-tag .badge { margin: 0 4px 2px 0; }
  #tooltip .tt-when { color: var(--muted); margin: 4px 0 2px; }
  #tooltip .tt-key { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
  #tooltip .tt-list { margin: 0; padding-left: 17px; font-size: 12.5px; line-height: 1.5; }
  #tooltip .tt-list li + li { margin-top: 3px; }
  @media (prefers-reduced-motion: reduce) { #tooltip { transition: none; transform: none; } }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; letter-spacing: .01em; vertical-align: middle; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 13%, transparent); }
  .badge.excellent { color: var(--up); }
  .badge.verygood { color: var(--good); }
  .badge.good { color: var(--accent); }
  .badge.average { color: var(--hot); }
  .badge.bad, .badge.sell { color: var(--down); }
  .badge.buy { color: var(--up); }
  .badge.neutral { color: var(--muted); }
  .badge.weak { border-style: dashed; background: none; font-weight: 600; }
  .tile.rated.weak { border-left-style: dashed; }
  .tile-rating { margin-top: 10px; min-height: 22px; }
  .tile.rated { border-left: 3px solid var(--line); }
  .tile.rated.excellent { border-left-color: var(--up); }
  .tile.rated.verygood { border-left-color: var(--good); }
  .tile.rated.good { border-left-color: var(--accent); }
  .tile.rated.average { border-left-color: var(--hot); }
  .tile.rated.bad, .tile.rated.sell { border-left-color: var(--down); }
  .tile.rated.buy { border-left-color: var(--up); }
  .tile.rated.neutral { border-left-color: var(--muted); }
  .zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .zone { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .zone-kind { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .zone-range { font-size: 18px; font-weight: 650; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .zone ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .zone ul.checks { list-style: none; padding-left: 0; margin-top: 8px; color: var(--text); }
  .zone ul.checks li { padding: 2px 0; }
  .chk { display: inline-block; width: 18px; font-weight: 700; text-align: center; }
  .chk.yes { color: var(--up); } .chk.no { color: var(--down); } .chk.na { color: var(--muted); }
  .zone-text { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .est { display: inline-block; padding: 0 5px; border: 1px dashed var(--muted); border-radius: 4px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; }
  .readlist { margin: 0 0 18px; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .tile-label { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile-verdict { margin: 10px 0 0; font-size: 13px; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); text-decoration: none; font-size: 13px; }
  .back:hover { text-decoration: underline; }
  .jump a[aria-current="page"] { color: var(--text); border-color: var(--accent); }
  .metric .hero { margin-top: 20px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  /* ---------- phones and narrow windows ---------- */
  @media (max-width: 760px) {
    header { position: static; flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; }
    #toggle { display: none; }
    .head-right { width: 100%; justify-content: space-between; gap: 10px; }
    .risk { font-size: 12px; gap: 6px; flex: none; }
    .risk input { width: 64px; font-size: 16px; } /* 16px stops iOS zooming in on focus */
    #status { min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status::before { flex: none; }
    main, main.closed { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; }
    /* The stock list becomes a swipeable strip that stays at the top while scrolling. */
    main.closed nav { display: block; }
    nav.panel { position: sticky; top: 0; z-index: 4; max-height: none; overflow: visible; border-radius: 10px; box-shadow: 0 6px 14px rgba(0, 0, 0, .18); }
    #list { display: flex; gap: 6px; padding: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #list::-webkit-scrollbar { display: none; }
    #list li { flex: none; }
    #list button { grid-template-columns: auto auto; gap: 1px 10px; padding: 7px 11px; min-width: 112px; }
    #list button > :first-child { grid-column: 1 / -1; }
    #list button > :first-child br { display: none; }
    #list button > :first-child .name { margin-right: 6px; }
    #list button[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
    .pill { min-width: 0; }
    #detail { padding: 14px 12px; min-height: 0; }
    #detail h2 { font-size: 18px; }
    .back { padding: 6px 0; margin-bottom: 6px; }
    .jump { flex-wrap: nowrap; overflow-x: auto; margin: 12px -12px 0; padding: 0 12px 4px; scrollbar-width: none; }
    .jump::-webkit-scrollbar { display: none; }
    .jump a { flex: none; white-space: nowrap; padding: 7px 12px; font-size: 13px; }
    .group { margin-top: 18px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 11px 12px; }
    .tile-title { gap: 6px; }
    .tile-value { font-size: 20px; margin-top: 8px; }
    .tile-label { font-size: 11px; }
    .tile-rating { margin-top: 8px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .hero { flex-wrap: wrap; gap: 4px 10px; margin: 16px 0 4px; }
    .hero .big { font-size: 38px; }
    .metric .hero { margin-top: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
    .stat { padding: 9px 10px; }
    .stat .v { font-size: 15px; overflow-wrap: anywhere; }
    .chart-head { flex-wrap: wrap; gap: 4px 12px; }
    .legend { flex-wrap: wrap; gap: 4px 12px; }
    .ladder div { gap: 10px; align-items: baseline; }
    .ladder .sub { display: block; }
    table.book, table.levels { font-size: 13px; }
    table.book th, table.book td, table.levels th, table.levels td { padding: 6px 5px; }
    /* Order counts are dropped on a phone so price and quantity fit. */
    table.book tr > :first-child, table.book tr > :last-child { display: none; }
    table.levels .sub { display: block; }
    #tooltip { max-width: calc(100vw - 20px); }
    /* No double-tap zoom delay and no grey flash on tappable things. */
    #list button, .tile, .jump a, .back, .group-title a, .info { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #list { touch-action: pan-x; }
  }
  @media (max-width: 360px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="head-left">
    <button id="toggle" type="button" aria-controls="stocks" aria-expanded="true">☰ <span id="toggle-text">Hide stocks</span></button>
    <h1>Trading dashboard</h1>
  </div>
  <div class="head-right">
    <label class="risk">Max risk per trade <span class="risk-box">₹<input id="max-risk" type="number" min="1" step="100" inputmode="decimal" aria-describedby="risk-help"></span></label>
    <span id="risk-help" hidden>Used by the Execution section to size positions.</span>
    <div id="status" role="status">Connecting…</div>
  </div>
</header>
<main>
  <nav class="panel" id="stocks" aria-label="Stocks">
    <div class="list-head"><span id="list-title">Stocks</span><span class="info how" data-key="sel:0" role="button" aria-label="How the stocks are selected">?</span></div>
    <ul id="list"></ul>
  </nav>
  <section class="panel" id="detail" aria-live="polite"><p class="empty">Waiting for data…</p></section>
</main>
<div id="tooltip" role="tooltip"></div>
<script>
const rows = new Map();          // sym -> latest row
let order = [];                  // symbols in config order
let selected = null;
let curves = null;               // { sym, average, today } for the selected symbol
let feed = { feed: 'connecting' };
let socketUp = false;

const $ = (id) => document.getElementById(id);
const short = (sym) => sym.replace(/^[A-Z]+:/, '').replace(/-EQ$/, '');
const exchange = (sym) => (sym.includes(':') ? sym.split(':')[0] : '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const price = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const compact = new Intl.NumberFormat('en-IN', { notation: 'compact', maximumFractionDigits: 2 });
const fmt = (f, v) => (v == null ? '–' : f.format(v));
const fmtRvol = (v) => (v == null ? '–' : v.toFixed(2) + '×');
const clock = (ms) => new Date(ms).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
const dayText = (ms) => new Date(ms).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
const istDay = (ms) => Math.floor((ms + 19800000) / 86400000);

function verdict(v) {
  if (v == null) return '';
  if (v >= 2) return 'Volume is running at more than twice its usual pace for this time of day.';
  if (v >= 1.5) return 'Volume is well above its usual pace for this time of day.';
  if (v >= 1.1) return 'Volume is a little above its usual pace for this time of day.';
  if (v >= 0.9) return 'Volume is in line with its usual pace for this time of day.';
  if (v >= 0.7) return 'Volume is a little below its usual pace for this time of day.';
  return 'Volume is well below its usual pace for this time of day.';
}

function renderStatus() {
  const el = $('status');
  $('list-title').textContent = feed.selection?.source === 'scan' ? 'Selected stocks' : 'Stocks';
  const newest = Math.max(0, ...[...rows.values()].map((r) => r.asOf ?? 0));
  el.className = '';
  if (!socketUp) { el.textContent = 'Dashboard server not reachable. Retrying…'; el.className = 'down'; return; }
  if (feed.feed !== 'connected') { el.textContent = feed.feed === 'connecting' ? 'Connecting to Fyers…' : 'Fyers feed disconnected. Reconnecting…'; el.className = 'down'; return; }
  if (!newest) { el.textContent = 'Connected. Waiting for the first quotes…'; return; }
  if (Date.now() - newest < 60000) { el.textContent = 'Live · ' + clock(newest) + ' IST'; el.className = 'live'; return; }
  // Before 09:15 on a trading day Fyers has already reset volume, VWAP and day change for the new session.
  const mins = (ms) => { const d = new Date(ms + 19800000); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
  if (istDay(newest) === istDay(Date.now()) && mins(Date.now()) < 555) {
    el.textContent = 'Before market open · today\'s volume and VWAP start at 09:15 IST';
    return;
  }
  el.textContent = 'Market closed · showing ' + dayText(newest) + ', ' + clock(newest) + ' IST';
}

function renderList() {
  $('list').innerHTML = order.map((sym) => {
    const r = rows.get(sym) ?? {};
    const chg = r.changePct;
    return `<li><button data-sym="${esc(sym)}" aria-current="${sym === selected}">
      <span><span class="name">${esc(short(sym))}</span><span class="exch">${esc(exchange(sym))}</span><br><span class="sub num">${fmt(price, r.ltp)}${r.vwapDevPct == null ? '' : ` <span class="${r.vwapDevPct >= 0 ? 'up' : 'down'}" title="Price is ${r.vwapDevPct >= 0 ? 'above' : 'below'} VWAP${r.vwapDevAtr == null ? '' : ' by ' + Math.abs(r.vwapDevAtr).toFixed(2) + ' ATR'}">${r.vwapDevPct >= 0 ? '▲' : '▼'} ${r.vwapDevAtr == null ? 'VWAP' : Math.abs(r.vwapDevAtr).toFixed(1) + ' ATR'}</span>`}</span></span>
      <span class="sub num ${chg == null ? '' : chg >= 0 ? 'up' : 'down'}">${chg == null ? '' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%'}</span>
      <span class="pill num ${rate('rvol', r.rvol)?.grade ?? 'none'}" title="Relative volume${rate('rvol', r.rvol) ? ': ' + rate('rvol', r.rvol).label : ''}">${fmtRvol(r.rvol)}</span>
    </button></li>`;
  }).join('');
}

/** Line chart over the 375 session minutes. lines: [{ data, cls }]; fromZero pins the y-axis at 0. */
let drawCharts = true;
function chartSvg(lines, { fromZero, format, label, range, guides = [] }) {
  if (!drawCharts) return '';
  // Drawn at the panel's real pixel width so a wide page gives a wider chart, not a taller one.
  const pad = parseFloat(getComputedStyle($('detail')).paddingLeft) || 0;
  const W = Math.max(280, $('detail').clientWidth - 2 * pad), H = 240, L = 58, R = 10, T = 10, B = 24, N = 375;
  const vals = lines.flatMap((l) => (l.data ?? []).filter((v) => v != null));
  if (!vals.length) return '<p class="empty">No data for this session yet.</p>';
  let min = fromZero ? 0 : Math.min(...vals), max = Math.max(...vals);
  if (range) { [min, max] = range; }
  else {
    for (const g of guides) { const v = typeof g === 'number' ? g : g.v; min = Math.min(min, v); max = Math.max(max, v); }
    if (max === min) { max += 1; min -= fromZero ? 0 : 1; }
    if (!fromZero) { const pad = (max - min) * 0.08; min -= pad; max += pad; }
  }
  const x = (i) => L + (i / (N - 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const path = (arr) => { let d = '', pen = false; arr.forEach((v, i) => { if (v == null) return; d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; }); return d; };
  guides = guides.map((g) => (typeof g === 'number' ? { v: g, label: format(g) } : g));
  // A guide label that would overlap one already drawn is left off; the line is still drawn.
  const labelYs = [];
  const guideLines = guides.map((g) => {
    const ly = y(g.v) - 4 < T + 8 ? y(g.v) + 13 : y(g.v) - 4;
    const room = labelYs.every((v) => Math.abs(v - ly) >= 13);
    if (room) labelYs.push(ly);
    return `<line class="guide" x1="${L}" x2="${W - R}" y1="${y(g.v)}" y2="${y(g.v)}"/>${room ? `<text x="${W - R}" y="${ly}" text-anchor="end">${g.label}</text>` : ''}`;
  }).join('');
  const yTicks = [0, 0.5, 1].map((f) => { const v = min + (max - min) * f; return `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${format(v)}</text>`; }).join('');
  const xTicks = [[0, '09:15'], [105, '11:00'], [225, '13:00'], [374, '15:30']].map(([i, t]) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 374 ? 'end' : 'middle'}">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${label}">
    ${yTicks}${xTicks}${guideLines}
    ${lines.map((l) => (l.data ? `<path class="${l.cls}" d="${path(l.data)}"/>` : '')).join('')}
  </svg>`;
}

// ----- Per-minute series worked out on the page from the curves the server sends. -----
const mapCurve = (a, f) => (a ? a.map((v, i) => (v == null ? null : f(v, i))) : null);
// A 5-minute-candle curve is stored at each candle's first minute. This carries each value
// forward from the minute its candle closed until the next one closes, i.e. what was known then.
function afterClose(curve) {
  if (!curve) return null;
  const out = new Array(375).fill(null);
  let v = null;
  for (let j = 0; j < 375; j++) {
    if (j >= 5 && curve[j - 5] != null) v = curve[j - 5];
    out[j] = v;
  }
  return out;
}
const candleClose = (c, i) => c.price?.[i + 4] ?? c.price?.[i] ?? null; // close of the 5-minute candle starting at minute i
function derivedCurves(c) {
  if (!c) return null;
  const atrNow = afterClose(c.atrCurve);
  const stop = mapCurve(c.price, (p, i) => (atrNow?.[i] > 0 ? STOP_ATR_MULT * atrNow[i] : null));
  return {
    rvol: mapCurve(c.today, (v, i) => (c.average?.[i] > 0 ? v / c.average[i] : null)),
    vwapDevPct: mapCurve(c.price, (p, i) => (c.vwapCurve?.[i] ? ((p - c.vwapCurve[i]) / c.vwapCurve[i]) * 100 : null)),
    vwapDevAtr: mapCurve(c.price, (p, i) => (c.vwapCurve?.[i] && atrNow?.[i] > 0 ? (p - c.vwapCurve[i]) / atrNow[i] : null)),
    atrPct: mapCurve(c.atrCurve, (a, i) => { const p = candleClose(c, i); return p ? (a / p) * 100 : null; }),
    relAtr: mapCurve(c.atrCurve, (a, i) => (c.atrUsualCurve?.[i] > 0 ? a / c.atrUsualCurve[i] : null)),
    normSlope: mapCurve(c.slopeCurve, (v) => v / EMA_SLOPE_CANDLES),
    priceVsEma: mapCurve(c.emaCurve, (e, i) => { const p = candleClose(c, i); return p != null && e ? ((p - e) / e) * 100 : null; }),
    buyShare: mapCurve(c.sellShareCurve, (v) => 100 - v),
    stop,
    stopLoss: mapCurve(stop, (d, i) => c.price[i] - d),
    target: mapCurve(stop, (d, i) => c.price[i] + REWARD_MULT * d),
    qty: mapCurve(stop, (d) => Math.floor(maxRisk / d)),
  };
}

const fmtAtr = (v) => (v == null ? '–' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' ATR');
// How a normalized VWAP deviation is used: which kind of setup it is a candidate for.
// Each returns the zones that apply, as { kind, tag, tone, range, points }.
function vwapZones(d) {
  if (d == null) return [];
  if (Math.abs(d) <= 0.5) return [{ kind: 'No-trade / neutral zone', tag: null, tone: 'neutral', range: '−0.5 to +0.5', points: ['Price is close to VWAP.', 'Avoid treating small deviations as meaningful opportunities.'] }];
  const below = d < 0;
  const side = below ? 'below' : 'above';
  const zones = [];
  if (Math.abs(d) > 1.5) {
    zones.push({ kind: 'Mean-reversion candidate', tag: 'Watch for reversal', tone: 'excellent', range: (below ? 'Below −1.5' : 'Above +1.5'), points: [
      `Price is significantly ${side} VWAP.`,
      `Look for weakening ${below ? 'selling' : 'buying'} pressure.`,
      `Check absorption and ${below ? 'buying' : 'selling'} response.`,
      'Wait for reversal confirmation.',
    ] });
  }
  if (Math.abs(d) > 1) {
    zones.push({ kind: 'Momentum candidate', tag: 'Watch for continuation', tone: 'good', range: (below ? 'Below −1.0' : 'Above +1.0'), points: [
      `Price is ${side} VWAP.`,
      `${below ? 'Downward' : 'Upward'} trend is confirmed.`,
      `${below ? 'Selling' : 'Buying'} pressure persists.`,
      `Look for ${below ? 'bearish' : 'bullish'} continuation rather than ${below ? 'buying' : 'selling'} simply because price is extended.`,
    ] });
  }
  return zones;
}
function stretchVerdict(d) {
  if (d == null) return '';
  const c = rateVwapDev(d);
  return `${rate('vwapInterp', d).label} (${fmtAtr(d)}): ${c.label.toLowerCase()}, ${c.text.toLowerCase()}.`;
}
function zonesHtml(d) {
  const zones = vwapZones(d);
  if (!zones.length) return d == null ? '' : '<div class="zone"><div class="zone-kind">No setup zone</div><p class="zone-text">Between ±0.5 and ±1.0: outside the neutral zone, but not yet a momentum or mean-reversion candidate.</p></div>';
  return zones.map((z) => `<div class="zone">
      <div class="zone-kind">${z.kind} ${z.tag ? `<span class="badge ${z.tone}">${z.tag}</span>` : ''}</div>
      <div class="zone-range">${z.range}</div>
      <ul>${z.points.map((p) => `<li>${p}</li>`).join('')}</ul>
    </div>`).join('');
}

const qty = new Intl.NumberFormat('en-IN');
function imbalanceVerdict(v, live) {
  if (v == null) return 'No order book received yet.';
  const buy = ((1 + v) / 2) * 100;
  const lead = v === 0 ? 'Buy and sell quantity in the top 5 levels are exactly balanced' : `${buy >= 50 ? 'Buyers' : 'Sellers'} hold ${Math.max(buy, 100 - buy).toFixed(0)}% of the quantity in the top 5 levels`;
  return lead + (live ? '.' : '. The market is closed, so this is the leftover book, not live interest.');
}
function bookTable(book) {
  if (!book || (!book.bids.length && !book.asks.length)) return '<p class="empty">No order book received yet.</p>';
  const max = Math.max(1, ...book.bids.map((l) => l[1]), ...book.asks.map((l) => l[1]));
  const cell = (l, side) => l
    ? `<td class="${side}">${qty.format(l[2])}</td><td class="${side}"><i class="bar" style="width:${((l[1] / max) * 100).toFixed(1)}%"></i><span>${qty.format(l[1])}</span></td><td class="${side} px">${price.format(l[0])}</td>`
    : `<td class="${side}"></td><td class="${side}"></td><td class="${side} px">–</td>`;
  let rowsHtml = '';
  for (let i = 0; i < 5; i++) {
    const b = cell(book.bids[i], 'bid');
    const a = cell(book.asks[i], 'ask').match(/<td[\s\S]*?<\/td>/g).reverse().join('');
    rowsHtml += `<tr>${b}${a}</tr>`;
  }
  return `<table class="book"><thead><tr><th>Orders</th><th>Bid qty</th><th>Bid</th><th class="ask">Ask</th><th class="ask">Ask qty</th><th class="ask">Orders</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
}

function levelsVerdict(r) {
  if (!r.pivots) return 'No previous session in the stored candles, so pivot levels can\'t be calculated.';
  const side = r.ltp >= r.pivots.p ? 'above the pivot, the bullish side' : 'below the pivot, the bearish side';
  if (!r.support) return `Price is below S3, under every pivot support. It is ${side}.`;
  if (!r.resistance) return `Price is above R3, over every pivot resistance. It is ${side}.`;
  return `Price is between ${r.support.name} and ${r.resistance.name}, and ${side}.`;
}
function levelsTable(r) {
  const p = r.pivots;
  const rowsData = [['R3', p.r3], ['R2', p.r2], ['R1', p.r1], ['Pivot', p.p], ['S1', p.s1], ['S2', p.s2], ['S3', p.s3]];
  let html = '';
  let placed = false;
  const nowRow = `<tr class="now"><td>Last price</td><td>₹${price.format(r.ltp)}</td><td></td></tr>`;
  for (const [name, v] of rowsData) {
    if (!placed && r.ltp >= v) { html += nowRow; placed = true; }
    const d = ((v - r.ltp) / r.ltp) * 100;
    html += `<tr><td>${name}${name === 'Pivot' ? '' : name[0] === 'R' ? ' <span class="sub">resistance</span>' : ' <span class="sub">support</span>'}</td><td>₹${price.format(v)}</td><td class="${d >= 0 ? 'up' : 'down'}">${signed(d)}%</td></tr>`;
  }
  if (!placed) html += nowRow;
  return `<table class="levels"><thead><tr><th>Level</th><th>Price</th><th>Distance from price</th></tr></thead><tbody>${html}</tbody></table>`;
}
const levelCard = (title, lv) => `<div class="stat"><div class="k">${title}</div><div class="v num">${lv ? lv.name + ' · ₹' + price.format(lv.price) : '–'}</div><div class="k num">${lv ? signed(lv.distancePct) + '% away' : ''}</div></div>`;

const swingTime = (t, asOf) => {
  const ms = t * 1000;
  const sameDay = asOf && istDay(ms) === istDay(asOf);
  return (sameDay ? '' : dayText(ms) + ', ') + clock(ms).slice(0, 5);
};
function swingVerdict(r) {
  const h = r.swingHigh, l = r.swingLow;
  if (!h && !l) return 'No swing highs or lows in the stored candles yet.';
  if (h?.broken) return 'Price is above the last swing high, so that resistance has been broken.';
  if (l?.broken) return 'Price is below the last swing low, so that support has been broken.';
  if (h && l) return 'Price is between the last swing low (support) and the last swing high (resistance).';
  return h ? 'Price is below the last swing high (resistance).' : 'Price is above the last swing low (support).';
}
const swingCard = (title, sw, asOf) => `<div class="stat"><div class="k">${title}</div><div class="v num">${sw ? '₹' + price.format(sw.price) : '–'}${sw?.broken ? '<span class="tag">broken</span>' : ''}</div><div class="k num">${sw ? 'formed ' + swingTime(sw.t, asOf) + ' · ' + signed(sw.distancePct) + '% away' : ''}</div></div>`;
function swingTable(r) {
  const all = [...r.swingHighs.map((x) => ({ ...x, kind: 'Swing high', role: 'resistance' })), ...r.swingLows.map((x) => ({ ...x, kind: 'Swing low', role: 'support' }))].sort((a, b) => b.t - a.t);
  if (!all.length) return '';
  return `<table class="levels"><thead><tr><th>Formed</th><th>Type</th><th>Price</th><th>Distance from price</th></tr></thead><tbody>${all.map((x) => {
    const d = ((x.price - r.ltp) / r.ltp) * 100;
    return `<tr><td>${swingTime(x.t, r.asOf)}</td><td>${x.kind} <span class="sub">${x.role}</span></td><td>₹${price.format(x.price)}</td><td class="${d >= 0 ? 'up' : 'down'}">${signed(d)}%</td></tr>`;
  }).join('')}</tbody></table>`;
}

function trendVerdict(slope, vsEma) {
  if (slope == null) return 'Not enough candles yet to calculate the EMA.';
  const rating = rateEmaSlope(slope / EMA_SLOPE_CANDLES);
  const side = vsEma == null ? '' : ` Price is ${Math.abs(vsEma).toFixed(2)}% ${vsEma >= 0 ? 'above' : 'below'} the EMA.`;
  return `${rating.slopeText}: ${signed(slope / EMA_SLOPE_CANDLES, 4)}% per candle.${side}`;
}
// How the engine uses the EMA slope. Each point carries ok: true / false when the dashboard can
// check it, or null when it needs something not on the dashboard yet (ADX, Efficiency Ratio).
function trendZone(r) {
  const v = emaSlopePerCandle(r);
  if (v == null) return null;
  if (Math.abs(v) <= 0.005) {
    return { kind: 'Mean-reversion candidate', tag: 'Flat slope', tone: 'average', action: 'Consider mean-reversion setups.', points: [
      ['EMA slope is close to zero.', true],
      ['ADX is relatively low.', null],
      ['Efficiency Ratio is low.', null],
      ['Price moves around VWAP.', r.vwapDevAtr == null ? null : Math.abs(r.vwapDevAtr) <= 0.5],
    ] };
  }
  const up = v > 0;
  if (Math.abs(v) < 0.02) {
    // Weak slopes are avoided: not flat enough for mean reversion, not strong enough for momentum.
    return { kind: 'No trend setup', tag: `Weak ${up ? 'bullish' : 'bearish'} slope · avoid`, tone: 'average', action: 'Avoid: the slope is too weak for a momentum setup and not flat enough for mean reversion.', points: [
      [`EMA slope is ${up ? 'positive' : 'negative'}, but under 0.02% per candle.`, true],
    ] };
  }
  return { kind: up ? 'Bullish momentum candidate' : 'Bearish momentum candidate', tag: up ? 'Positive slope' : 'Negative slope', tone: up ? 'buy' : 'sell', action: `Consider ${up ? 'bullish' : 'bearish'} momentum setups.`, points: [
    [`EMA slope is ${up ? 'positive' : 'negative'}.`, true],
    [`Price is ${up ? 'above' : 'below'} EMA.`, r.priceVsEmaPct == null ? null : (up ? r.priceVsEmaPct > 0 : r.priceVsEmaPct < 0)],
    ['ADX indicates trend strength.', null],
    up ? ['RVOL confirms increased activity.', r.rvol == null ? null : r.rvol > 1] : ['Selling pressure persists.', null],
  ] };
}
function trendZoneHtml(r) {
  const z = trendZone(r);
  if (!z) return '';
  const mark = (ok) => (ok == null ? '<span class="chk na" title="Not on the dashboard yet">?</span>' : ok ? '<span class="chk yes" title="True right now">✓</span>' : '<span class="chk no" title="Not true right now">✕</span>');
  return `<div class="zone">
      <div class="zone-kind">${z.kind} <span class="badge ${z.tone}">${z.tag}</span></div>
      <ul class="checks">${z.points.map(([text, ok]) => `<li>${mark(ok)} ${text}</li>`).join('')}</ul>
      <p class="zone-text">${z.action} <span class="sub">✓ true now · ✕ not true now · ? needs ADX or Efficiency Ratio, which are not on the dashboard yet.</span></p>
    </div>`;
}
function rsiVerdict(v) {
  if (v == null) return 'Not enough candles yet to calculate RSI.';
  return `RSI is ${v.toFixed(1)}: ${rate('rsi', v).text}.`;
}
const signed = (v, d = 2) => (v == null ? '–' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d));

function volVerdict(rel) {
  if (rel == null) return 'Not enough history yet to compare volatility with its usual level at this time of day.';
  return `Volatility rating: ${rate('relAtr', rel).label.toLowerCase().replace(' · ', ', ')}. ATR is ${rel.toFixed(2)}× its usual level for this time of day.`;
}

// ----- Width: how long the usual move takes (see src/lib/width.js). -----
const fmtMin = (v) => {
  if (v == null) return '–';
  const t = Math.round(v);
  return t < 60 ? t + ' min' : Math.floor(t / 60) + ' h ' + String(t % 60).padStart(2, '0') + ' min';
};
// The width that applies to the market right now: sideways or momentum, or null on a weak slope.
const widthNow = (r) => (!r.width ? null : r.widthRegime === 'sideways' ? { kind: 'sideways', s: r.width.sideways } : r.widthRegime === 'momentum' ? { kind: 'momentum', s: r.width.momentum } : null);
const regimeBadge = (r) => (r.widthRegime === 'sideways' ? { grade: 'neutral', label: 'Sideways market' } : r.widthRegime === 'momentum' ? { grade: 'good', label: 'Momentum market' } : r.emaSlopePct == null ? null : { grade: 'average', label: 'Weak slope · neither' });
const happened = (x) => (x?.completionPct == null ? 'no moves measured yet' : `happened ${x.completionPct.toFixed(0)}% of ${qty.format(x.started)} times`);
function widthVerdict(r) {
  const w = r.width;
  if (!w || (!w.sideways.started && !w.momentum.started)) return 'Needs completed 5-minute candles and an ATR to measure moves.';
  const now = widthNow(r);
  const span = `over the last ${w.sessions} sessions`;
  if (!now) return `The EMA slope is weak, so the market is neither sideways nor momentum right now. Both widths are below for reference.`;
  if (now.s.avg == null) return `The market is ${now.kind}, but no ${now.kind} moves finished ${span}, so there is no width yet.`;
  const move = now.kind === 'sideways' ? `moved 1 ATR away and came back to where it started` : `moved 2 ATR in one direction`;

function tradePlan(r) {
  if (r.ltp == null || !r.atr5) return null;

    ${c ? chartSvg([{ data: c.average, cls: 'l-avg' }, { data: c.today, cls: 'l-today' }], { fromZero: true, format: (v) => compact.format(v), label: 'Cumulative volume today against the average of previous sessions' }) : '<p class="empty">Loading chart…</p>'}
    <div class="chart-head" style="margin-top:18px"><h3>Recent RVOL through the session (15-minute windows)</h3><div class="legend"><span>Recent RVOL</span></div></div>
    ${c ? chartSvg([{ data: c.recentRvolCurve, cls: 'l-today' }], { fromZero: true, guides: [{ v: 1, label: '1× usual' }], format: (v) => v.toFixed(1) + '×', label: 'RVOL of each 15-minute window through the session, with 1 marked' }) : '<p class="empty">Loading chart…</p>'}
    ${chart('s-volume', 'Day RVOL through the session', [['', 'RVOL']], [{ data: dc?.rvol, cls: 'l-today' }], { fromZero: true, guides: [{ v: 1, label: '1× usual' }], format: (v) => v.toFixed(1) + '×' })}
    ${chart('s-volume', 'RVOL and raw volume trend (15 minutes vs the 15 before)', [['', 'RVOL volume trend'], ['avg', 'Raw volume trend']], [{ data: c?.rawVolumeTrendCurve, cls: 'l-avg' }, { data: c?.rvolTrendCurve, cls: 'l-today' }], { guides: [{ v: 20, label: 'rising +20%' }, { v: 0, label: '0' }, { v: -20, label: 'falling −20%' }], format: pctFmt(0) })}
    <p class="note">Day RVOL is cumulative, so it stays high after an active morning. Recent RVOL looks only at the last 15 minutes against the usual volume of those same minutes, so it shows whether activity is there now. RVOL volume trend compares it with the 15 minutes before: rising above +20%, falling below −20%. Raw volume trend compares the shares actually traded in the same two windows, with no adjustment for the time of day, so it is usually negative in the morning and positive late in the afternoon; it has no tag for that reason. During the session all three are recalculated on every quote, for the 15 minutes ending at the current moment: the newest minutes come from the live feed and the older ones from stored candles. For the first few minutes after a server start, and after the close, they use completed candles only.</p>
    <p class="note">RVOL = volume so far ÷ average volume by the same time of day. 1× is the base: exactly the usual volume. Below 1 means quieter than usual, above 1 means busier. It can never go below 0, because volume can't be negative. Ratings: under 1 below normal · 1–1.5 slightly above normal · 1.5–2 good · 2–3 very good · 3 and above excellent.</p>
    </div>

    <div class="metric" id="s-vwap">
      <div class="hero"><span class="big num">${r.vwap == null ? '–' : '₹' + price.format(r.vwap)}</span><span class="label">VWAP (volume-weighted average price)</span></div>
      <p class="verdict">${vwapVerdict(r.vwapDevPct)} ${stretchVerdict(r.vwapDevAtr)}</p>
      <div class="stats">
        <div class="stat"><div class="k">Last price</div><div class="v num">₹${fmt(price, r.ltp)}</div></div>
        <div class="stat"><div class="k">VWAP deviation (%)</div><div class="v num ${r.vwapDevPct == null ? '' : r.vwapDevPct >= 0 ? 'up' : 'down'}">${r.vwapDevPct == null ? '–' : (r.vwapDevPct >= 0 ? '+' : '') + r.vwapDevPct.toFixed(2) + '%'}</div></div>
        <div class="stat"><div class="k">VWAP deviation (₹)</div><div class="v num">${r.vwap == null ? '–' : (r.ltp - r.vwap >= 0 ? '+' : '−') + '₹' + price.format(Math.abs(r.ltp - r.vwap))}</div></div>
        <div class="stat"><div class="k">Normalized VWAP deviation</div><div class="v num ${r.vwapDevAtr == null ? '' : r.vwapDevAtr >= 0 ? 'up' : 'down'}">${fmtAtr(r.vwapDevAtr)}</div><div class="k">${badge(rateVwapDev(r.vwapDevAtr))} ${r.vwapDevAtr == null ? '' : rateVwapDev(r.vwapDevAtr).text}</div><div class="k">${r.vwapDevAtr == null ? '' : rate('vwapInterp', r.vwapDevAtr).label}</div><div class="k">range: &lt; 0 below VWAP · 0 at VWAP · &gt; 0 above VWAP</div></div>
        <div class="stat"><div class="k">5-minute ATR</div><div class="v num">${r.atr5 == null ? '–' : '₹' + price.format(r.atr5)}</div></div>
      </div>
      <div class="chart-head"><h3>How to use the normalized deviation right now</h3></div>
      <div class="zones">${zonesHtml(r.vwapDevAtr)}</div>
      <div class="chart-head"><h3>Price and VWAP through the session</h3>
        <div class="legend"><span>Price</span><span class="vw">VWAP</span></div></div>
      ${c ? chartSvg([{ data: c.vwapCurve, cls: 'l-vwap' }, { data: c.price, cls: 'l-today' }], { fromZero: false, format: (v) => price.format(v), label: 'Price against VWAP through the session' }) : '<p class="empty">Loading chart…</p>'}
      ${chart('s-vwap', 'VWAP deviation (%) through the session', [['', 'Deviation %']], [{ data: dc?.vwapDevPct, cls: 'l-today' }], { guides: [{ v: 0, label: 'at VWAP' }], format: pctFmt(2) })}
      ${chart('s-vwap', 'Normalized VWAP deviation through the session', [['', 'Deviation in ATR']], [{ data: dc?.vwapDevAtr, cls: 'l-today' }], { guides: [{ v: 1.5, label: '+1.5' }, { v: 1, label: '+1.0' }, { v: 0, label: '0' }, { v: -1, label: '−1.0' }, { v: -1.5, label: '−1.5' }], format: (v) => signed(v) })}
      <p class="note">VWAP is the average price paid today, weighted by volume. It comes from the exchange feed and resets each morning. Normalized VWAP deviation = (price − VWAP) ÷ 5-minute ATR(14), so it shows the distance in units of the stock's own recent movement. 0 is the base: price exactly at VWAP. It can be less than 0 (price below VWAP) or greater than 0 (price above VWAP), with no fixed limit either way. Classification by distance from VWAP, either side: below 0.5 avoid (no deviation-based setup) · 0.5–1.0 moderate (lower priority) · 1.0–1.5 good candidate (evaluate setup) · above 1.5 excellent candidate (strongly consider for evaluation). Ranges: within ±0.5 close to VWAP (no-trade zone) · 0.5–1.0 moderately · 1.0–1.5 significantly · 1.5–2.0 strongly extended · beyond 2.0 extremely extended, above or below. Beyond ±1.0 is a momentum candidate; beyond ±1.5 is also a mean-reversion candidate. These are initial research thresholds, not validated trading levels.</p>
    </div>

    <div class="metric" id="s-volatility">
      <div class="hero"><span class="big num">${r.relAtr == null ? '–' : r.relAtr.toFixed(2) + '×'}</span><span class="label">relative ATR (volatility vs usual at this time of day) ${badge(rate('relAtr', r.relAtr))}</span></div>
      <p class="verdict">${volVerdict(r.relAtr)}</p>
      <div class="stats">
        <div class="stat"><div class="k">True range (last 5-min candle)</div><div class="v num">${r.tr5 == null ? '–' : '₹' + price.format(r.tr5)}</div></div>
        <div class="stat"><div class="k">ATR (14, 5-min)</div><div class="v num">${r.atr5 == null ? '–' : '₹' + price.format(r.atr5)}</div></div>
        <div class="stat"><div class="k">ATR %</div><div class="v num">${r.atrPct == null ? '–' : r.atrPct.toFixed(3) + '%'}</div></div>
        <div class="stat"><div class="k">Usual ATR at this time</div><div class="v num">${r.atrUsual == null ? '–' : '₹' + price.format(r.atrUsual)}</div><div class="k num">${r.relAtrSessions ? 'average of last ' + r.relAtrSessions + ' sessions' : ''}</div></div>
        <div class="stat"><div class="k">Relative ATR</div><div class="v num">${r.relAtr == null ? '–' : r.relAtr.toFixed(2) + '×'}</div><div class="k">+ve value · 1× = usual</div></div>
      </div>
      <div class="chart-head"><h3>True range and ATR through the session (5-minute candles)</h3>
        <div class="legend"><span>True range</span><span class="vw">ATR</span><span class="avg">Usual ATR</span></div></div>
      ${c ? chartSvg([{ data: c.trCurve, cls: 'l-today' }, { data: c.atrUsualCurve, cls: 'l-avg' }, { data: c.atrCurve, cls: 'l-vwap' }], { fromZero: true, format: (v) => price.format(v), label: 'True range of each 5-minute candle against ATR' }) : '<p class="empty">Loading chart…</p>'}
      ${chart('s-volatility', 'Relative ATR through the session', [['', 'Relative ATR']], [{ data: dc?.relAtr, cls: 'l-today' }], { fromZero: true, guides: [{ v: 1, label: '1× usual' }, { v: 2, label: '2× avoid above' }], format: (v) => v.toFixed(2) + '×' })}
      ${chart('s-volatility', 'ATR % through the session', [['', 'ATR % of price']], [{ data: dc?.atrPct, cls: 'l-today' }], { fromZero: true, format: (v) => v.toFixed(3) + '%' })}
      <p class="note">True range is the largest of a candle's high − low and its gaps from the previous close. ATR is its 14-candle average. ATR % = ATR ÷ price, which makes stocks comparable. Relative ATR = ATR ÷ the average ATR at the same time of day over the last 20 sessions; 1× is normal for this time of day. It is a ratio of two ATRs, so it is always positive and says nothing about direction: above 1 means more movement than usual, below 1 means less. Ratings: under 0.8 bad · 0.8–1 normal, avoid · 1–1.2 normal, good · 1.2–1.5 very good · 1.5–2 exceptional · 2–3 very high, avoid · above 3 extreme, avoid. These use completed 5-minute candles and refresh every 5 minutes.</p>
    </div>

    <div class="metric" id="s-width">
      <div class="hero"><span class="big num">${fmtMin(widthNow(r)?.s.avg)}</span><span class="label">width now: usual time for the move this market makes ${badge(regimeBadge(r))}</span></div>
      <p class="verdict">${widthVerdict(r)}</p>
      <div class="stats">
        <div class="stat"><div class="k">Sideways width (average)</div><div class="v num">${fmtMin(r.width?.sideways.avg)}</div><div class="k">1 ATR out, then back to the start · median ${fmtMin(r.width?.sideways.median)}</div></div>
        <div class="stat"><div class="k">Sideways: how often</div><div class="v num">${r.width?.sideways.completionPct == null ? '–' : r.width.sideways.completionPct.toFixed(0) + '%'}</div><div class="k">${r.width ? qty.format(r.width.sideways.count) + ' of ' + qty.format(r.width.sideways.started) + ' sideways starts finished before the close' : ''}</div></div>
        <div class="stat"><div class="k">Momentum width (average)</div><div class="v num">${fmtMin(r.width?.momentum.avg)}</div><div class="k">2 ATR in one direction · median ${fmtMin(r.width?.momentum.median)}</div></div>
        <div class="stat"><div class="k">Momentum: how often</div><div class="v num">${r.width?.momentum.completionPct == null ? '–' : r.width.momentum.completionPct.toFixed(0) + '%'}</div><div class="k">${r.width ? qty.format(r.width.momentum.count) + ' of ' + qty.format(r.width.momentum.started) + ' momentum starts finished before the close' : ''}</div></div>
        <div class="stat"><div class="k">1 ATR out and back, any market</div><div class="v num">${fmtMin(r.width?.any.sideways.avg)}</div><div class="k">${happened(r.width?.any.sideways)}</div></div>
        <div class="stat"><div class="k">2 ATR move, any market</div><div class="v num">${fmtMin(r.width?.any.momentum.avg)}</div><div class="k">${happened(r.width?.any.momentum)}</div></div>
        <div class="stat"><div class="k">Distances now</div><div class="v num">${r.atr5 == null ? '–' : '₹' + price.format(r.atr5) + ' · ₹' + price.format(2 * r.atr5)}</div><div class="k">1 ATR · 2 ATR (5-min ATR 14)</div></div>
        <div class="stat"><div class="k">Measured over</div><div class="v num">${r.width ? r.width.sessions + ' sessions' : '–'}</div><div class="k">a start at every 5-minute close</div></div>
      </div>
      ${chart('s-width', 'Width of each move that started today', [['', '1 ATR out and back'], ['vw', '2 ATR move']], [{ data: c?.widthReversionCurve, cls: 'l-today' }, { data: c?.widthMomentumCurve, cls: 'l-vwap' }], { fromZero: true, guides: [r.width?.sideways.avg != null && { v: r.width.sideways.avg, label: 'sideways average' }, r.width?.momentum.avg != null && { v: r.width.momentum.avg, label: 'momentum average' }].filter(Boolean), format: (v) => Math.round(v) + ' min' })}
      <p class="note">Width is a time, not a price: how long price usually takes to make a move. From every 5-minute close (the start), using the 5-minute ATR(14) at that moment: <b>sideways width</b> = minutes until price has gone 1 ATR away (either way) and come back to the starting price; <b>momentum width</b> = minutes until price has gone 2 ATR away in one direction. Each is averaged only over starts that were in that kind of market, judged by the EMA slope at the time: within ±0.005% per candle is sideways, 0.02% or more either way is momentum, in between is neither. Touches are found on 1-minute highs and lows, and the time runs to the end of the minute that reached the level. A move must finish in the same session; one still open at the close is not averaged, and counts as not happening. The chart shows each of today's starts at the minute it started, once its move has finished. These figures refresh every 5 minutes with the candles. They describe how this stock has behaved, not what it will do next.</p>
    </div>

    <div class="metric" id="s-momentum">
      <div class="hero"><span class="big num ${r.roc == null ? '' : r.roc >= 0 ? 'up' : 'down'}">${signed(r.roc)}${r.roc == null ? '' : '%'}</span><span class="label">rate of change (10 candles, 5-min)</span></div>
      <p class="verdict">${r.roc == null ? 'Not enough candles yet to calculate the rate of change.' : `Price is ${Math.abs(r.roc).toFixed(2)}% ${r.roc >= 0 ? 'higher' : 'lower'} than 50 minutes ago.`} ${rsiVerdict(r.rsi)}</p>
      <div class="stats">
        <div class="stat"><div class="k">Rate of change (10 candles)</div><div class="v num ${r.roc == null ? '' : r.roc >= 0 ? 'up' : 'down'}">${signed(r.roc)}${r.roc == null ? '' : '%'}</div><div class="k">compares price with 50 minutes ago</div></div>
        <div class="stat"><div class="k">RSI (14)</div><div class="v num">${r.rsi == null ? '–' : r.rsi.toFixed(1)} ${badge(rate('rsi', r.rsi))}</div><div class="k">base 50 = gains and losses equal · below 50 bearish · above 50 bullish · range 0 to 100</div></div>
      </div>
      <div class="chart-head"><h3>Rate of change through the session</h3><div class="legend"><span>ROC %</span></div></div>
      ${c ? chartSvg([{ data: c.rocCurve, cls: 'l-today' }], { guides: [0], format: (v) => v.toFixed(2), label: 'Rate of change through the session with zero marked' }) : '<p class="empty">Loading chart…</p>'}
      <div class="chart-head" style="margin-top:18px"><h3>RSI through the session</h3><div class="legend"><span>RSI</span></div></div>
      ${c ? chartSvg([{ data: c.rsiCurve, cls: 'l-today' }], { range: [0, 100], guides: [30, 70], format: (v) => v.toFixed(0), label: 'RSI through the session with 30 and 70 marked' }) : '<p class="empty">Loading chart…</p>'}
      <p class="note">Rate of change = how far price has moved, in percent, over the last 10 five-minute candles. Positive means momentum is up. RSI (0 to 100) compares the size of recent gains with recent losses over 14 candles. 50 is the base: recent gains and losses are the same size. Below 50 means losses have been larger than gains (bearish, downward momentum); above 50 means gains have been larger (bullish, upward momentum). The further from 50, the stronger. RSI ratings: under 30 strong bearish · 30–40 normal bearish · 40–50 weak bearish · 50–60 weak bullish · 60–70 normal bullish · above 70 strong bullish. Both headline values include the candle now forming, using the last price; the charts show completed candles.</p>
    </div>

    <div class="metric" id="s-trend">
      <div class="hero"><span class="big num ${r.emaSlopePct == null ? '' : r.emaSlopePct >= 0 ? 'up' : 'down'}">${signed(r.emaSlopePct, 3)}${r.emaSlopePct == null ? '' : '%'}</span><span class="label">EMA slope (20-candle EMA, 5-min) ${badge(rateEmaSlope(emaSlopePerCandle(r)))}</span></div>
      <p class="verdict">${trendVerdict(r.emaSlopePct, r.priceVsEmaPct)}</p>
      <div class="stats">
        <div class="stat"><div class="k">EMA (20)</div><div class="v num">${r.ema == null ? '–' : '₹' + price.format(r.ema)}</div></div>
        <div class="stat"><div class="k">EMA slope %</div><div class="v num ${r.emaSlopePct == null ? '' : r.emaSlopePct >= 0 ? 'up' : 'down'}">${signed(r.emaSlopePct, 3)}${r.emaSlopePct == null ? '' : '%'}</div></div>
        <div class="stat"><div class="k">Normalized EMA slope %</div><div class="v num ${r.emaSlopePct == null ? '' : r.emaSlopePct >= 0 ? 'up' : 'down'}">${signed(emaSlopePerCandle(r), 4)}${r.emaSlopePct == null ? '' : '%'}</div><div class="k num">${r.emaSlopePct == null ? '' : signed(r.emaSlopePct, 3) + '% ÷ 5 candles'}</div><div class="k">${badge(rateEmaSlope(emaSlopePerCandle(r)))}</div></div>
        <div class="stat"><div class="k">Price vs EMA</div><div class="v num ${r.priceVsEmaPct == null ? '' : r.priceVsEmaPct >= 0 ? 'up' : 'down'}">${signed(r.priceVsEmaPct)}${r.priceVsEmaPct == null ? '' : '%'}</div></div>
      </div>
      <div class="chart-head"><h3>How the engine uses the EMA slope right now</h3></div>
      <div class="zones">${trendZoneHtml(r)}</div>
      <div class="chart-head"><h3>Price and EMA through the session</h3><div class="legend"><span>Price</span><span class="vw">EMA (20)</span></div></div>
      ${c ? chartSvg([{ data: c.emaCurve, cls: 'l-vwap' }, { data: c.price, cls: 'l-today' }], { format: (v) => price.format(v), label: 'Price against its 20-candle EMA through the session' }) : '<p class="empty">Loading chart…</p>'}
      <div class="chart-head" style="margin-top:18px"><h3>EMA slope through the session</h3><div class="legend"><span>Slope %</span></div></div>
      ${c ? chartSvg([{ data: c.slopeCurve, cls: 'l-today' }], { guides: [0], format: (v) => v.toFixed(3), label: 'EMA slope through the session with zero marked' }) : '<p class="empty">Loading chart…</p>'}
      ${chart('s-trend', 'Normalized EMA slope (% per candle) through the session', [['', 'Slope % per candle']], [{ data: dc?.normSlope, cls: 'l-today' }], { guides: [{ v: 0.02, label: '+0.02' }, { v: 0, label: '0' }, { v: -0.02, label: '−0.02' }], format: (v) => v.toFixed(3) })}
      ${chart('s-trend', 'Price vs EMA (%) through the session', [['', 'Price vs EMA %']], [{ data: dc?.priceVsEma, cls: 'l-today' }], { guides: [{ v: 0, label: 'at EMA' }], format: pctFmt(2) })}
      <p class="note">EMA is an average of the last 20 five-minute closes that gives recent candles more weight. EMA slope % = how much the EMA itself has changed over the last 5 candles (25 minutes): positive means the trend is rising, near zero means it is flattening. Normalized EMA slope % = EMA slope % ÷ 5, the average change in the EMA per candle. Ratings by size, in either direction: within ±0.005% avoid (flat, no clear trend) · 0.005–0.02% weak, avoid · 0.02–0.05% good candidate · above 0.05% excellent (strong trend). Headline values include the candle now forming; the charts show completed candles.</p>
    </div>

    <div class="metric" id="s-book">
      <div class="hero"><span class="big num ${r.imbalance5 == null ? '' : r.imbalance5 >= 0 ? 'up' : 'down'}">${signed(r.imbalance5)}</span><span class="label">order book imbalance (top 5 levels)${r.book && !r.bookLive ? '<span class="tag">market closed</span>' : ''}</span></div>

      <div class="split-labels"><span>Buy ${qty.format(r.bidQty5)}</span><span>Sell ${qty.format(r.askQty5)}</span></div>`}
      <div class="stats">
        <div class="stat"><div class="k">Spread %</div><div class="v num">${r.spreadPct == null ? '–' : r.spreadPct.toFixed(4) + '%'} ${badge(rate('spreadPct', r.spreadPct))}</div><div class="k">0–0.05% excellent · 0.05–0.1% very good · above 0.1% bad, not considered</div></div>
        <div class="stat"><div class="k">Spread scale</div><div class="v num" style="font-size:14px"><b>0 = no gap</b> · wider →</div><div class="k">never below 0 · usually below 0.2% · above 0.1% is not considered</div></div>
        <div class="stat"><div class="k">Spread (₹)</div><div class="v num">${r.spread == null ? '–' : '₹' + price.format(r.spread)}</div></div>
        <div class="stat"><div class="k">Imbalance, top 5 levels</div><div class="v num ${r.imbalance5 == null ? '' : r.imbalance5 >= 0 ? 'up' : 'down'}">${signed(r.imbalance5)} ${r.bookLive ? badge(rate('imbalance', r.imbalance5)) : ''}</div></div>
        <div class="stat"><div class="k">Imbalance, whole book</div><div class="v num ${r.imbalanceBook == null ? '' : r.imbalanceBook >= 0 ? 'up' : 'down'}">${signed(r.imbalanceBook)} ${r.bookLive ? badge(rate('imbalance', r.imbalanceBook)) : ''}</div></div>
        <div class="stat"><div class="k">Ask quantity trend</div><div class="v num">${pct(r.askQtyTrend?.pct, 0)}</div><div class="k">${r.askQtyTrend?.pct == null ? bookWaitText(r.askQtyTrend, r.flow) : badge(bookQtyRating('ask', r.askQtyTrend))}</div></div>
        <div class="stat"><div class="k">Bid quantity trend</div><div class="v num">${pct(r.bidQtyTrend?.pct, 0)}</div><div class="k">${r.bidQtyTrend?.pct == null ? bookWaitText(r.bidQtyTrend, r.flow) : badge(bookQtyRating('bid', r.bidQtyTrend))}</div></div>

      <div class="chart-head"><h3>Order book depth (best 5 levels each side)</h3></div>
      ${bookTable(r.book)}
      ${chart('s-book', 'Spread % through the session', [['', 'Spread % (minute average)']], [{ data: c?.spreadPctCurve, cls: 'l-today' }], { fromZero: true, guides: [{ v: 0.05, label: '0.05%' }, { v: 0.1, label: '0.1% limit' }], format: (v) => v.toFixed(3) + '%' })}
      ${chart('s-book', 'Order book imbalance through the session', [['', 'Top 5 levels'], ['vw', 'Whole book']], [{ data: c?.imbalanceBookCurve, cls: 'l-vwap' }, { data: c?.imbalance5Curve, cls: 'l-today' }], { range: [-1, 1], guides: [{ v: 0, label: 'balanced' }], format: (v) => signed(v) })}
      ${chart('s-book', 'Whole-book buy and sell quantity through the session', [['buy', 'Buy quantity'], ['sell', 'Sell quantity']], [{ data: c?.bookBuyQtyCurve, cls: 'l-buy' }, { data: c?.bookSellQtyCurve, cls: 'l-sell' }], { fromZero: true, format: (v) => compact.format(v) })}

async function loadCurves(sym) {
  try {
    const res = await fetch('/api/detail?sym=' + encodeURIComponent(sym));
    if (!res.ok) return;
    const d = await res.json();
    if (sym === selected) {
      // Every per-minute curve from the server (the row fields that come with it are left out).
      curves = { sym };
      for (const [k, v] of Object.entries(d)) if (Array.isArray(v) && v.length === 375) curves[k] = v;
      curves.average = d.average; // null when the stock has no volume history
      renderDetail();
    }
  } catch { /* server down; the socket status already says so */ }
}

function select(sym) {
  selected = sym;
  remember('stock', sym);
  curves = null;
  renderList();
  renderDetail();
  loadCurves(sym);
}

function applyRow(r) {
  const prev = rows.get(r.sym);
  rows.set(r.sym, r);
  // Keep the chart's live point current, and reload the curves when the session day changes.
  if (r.sym === selected && curves?.today && r.volume != null && r.asOf) {
    if (prev?.asOf && istDay(prev.asOf) !== istDay(r.asOf)) { loadCurves(r.sym); return; }
    const d = new Date(r.asOf + 19800000);
    const idx = Math.floor((d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds() - 33300) / 60);
    if (idx >= 0) {
      const i = Math.min(idx, 374);
      curves.today[i] = r.volume;
      if (curves.price && r.ltp != null) curves.price[i] = r.ltp;
      if (curves.vwapCurve && r.vwap) curves.vwapCurve[i] = r.vwap;
    }
  }
}

// Max risk per trade: lives in the header (outside the redrawn panel) and is remembered.
$('max-risk').value = maxRisk;
$('max-risk').addEventListener('input', (e) => {
  const v = Number(e.target.value);
  if (!(v > 0)) return; // ignore empty or invalid input while typing
  maxRisk = v;
  try { localStorage.setItem('maxRisk', String(v)); } catch { /* storage unavailable */ }
  schedule();
});

// Stock list open/closed, remembered across refreshes.
function setSidebar(open) {
  document.querySelector('main').classList.toggle('closed', !open);
  $('toggle').setAttribute('aria-expanded', String(open));
  $('toggle-text').textContent = open ? 'Hide stocks' : 'Show stocks';
  try { localStorage.setItem('sidebarOpen', open ? '1' : '0'); } catch { /* storage unavailable */ }
  if (typeof schedule === 'function') schedule();
}
$('toggle').addEventListener('click', () => setSidebar(document.querySelector('main').classList.contains('closed')));
try { if (localStorage.getItem('sidebarOpen') === '0') setSidebar(false); } catch { /* storage unavailable */ }

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-sym]');
  if (b) select(b.dataset.sym);
});

function guideHtml(title) {
  const g = GUIDE[title];
  if (!g) return '<div class="tt-note">No interpretation notes for this tile yet.</div>';
  const list = (items) => `<ul class="tt-list">${items.map((x) => `<li>${x}</li>`).join('')}</ul>`;
  // Tags are drawn with the same badge as on the tile, so each explanation sits under the tag it explains.
  const directional = (g.tags ?? []).some(([, grade]) => /buy|sell/.test(grade));
  const key = directional
    ? 'Colours: green leans to buyers, red to sellers, grey is neutral. A dashed outline marks a weaker reading.'
    : 'Colours: green is best, then teal, blue and amber. Red is bad and grey is neutral.';
  const tags = !g.tags ? '' : `<div class="tt-h">What each tag means</div>
    <div class="tt-tags">${g.tags.map(([label, grade, when, meaning]) => `<div class="tt-tag">${[].concat(label).map((l) => badge({ grade, label: l })).join('')}<div class="tt-when">Shown when: ${when}</div><div>${meaning}</div></div>`).join('')}</div>
    <p class="tt-key">${g.tagNote ? g.tagNote + ' ' : ''}${key}</p>`;
  return `<div class="tt-h">What it tells you</div><p class="tt-p">${g.what}</p>
    <div class="tt-h">How to read it</div><dl class="tt-rows">${g.read.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${tags}
    <div class="tt-h">Check it against</div>${list(g.use)}
    <div class="tt-h">Keep in mind</div>${list(g.mind)}`;
}
