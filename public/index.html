  const sel = feed.selection ?? {};
  const c = { minTurnoverCrore: 20, minAtrPct: 1, minRvol: 1.5, maxSpreadPct: 0.1, rvolDays: 10, baselineDays: 20, ...(sel.config ?? {}) };
  const rowsHtml = (items) => `<dl class="tt-rows">${items.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  const list = (items) => `<ul class="tt-list">${items.map((x) => `<li>${x}</li>`).join('')}</ul>`;
  const source = sel.source === 'scan'
    ? `This list: the top ${sel.shown} of ${sel.matched} stocks that passed, out of ${sel.evaluated} evaluated, from the ${sel.session} session.`
    : 'This list is the fixed one from config/dashboard.json: the scan was skipped, failed, or selected nothing, so the rules below were not applied to it.';
  return `<div class="tt-h">What it does</div>
    <p class="tt-p">Each time the dashboard starts, it scans the Nifty 100 stocks for the latest completed trading session and keeps the ones that are liquid, volatile enough and unusually active. Those are ranked by a score and the best are listed here, highest score first. The list stays the same until the dashboard is restarted on a later day.</p>
    <div class="tt-h">Step 1 · Filters (a stock must pass all)</div>
    ${rowsHtml([
      ['Liquidity', `Average traded value over the last ${c.baselineDays} sessions is at least ₹${c.minTurnoverCrore} crore.`],
      ['Volatility', `Daily ATR(14) is at least ${c.minAtrPct}% of the previous close.`],
      ['Unusual volume', `RVOL is at least ${c.minRvol}: the session's volume against the average of the previous ${c.rvolDays} sessions.`],
      ['Spread', `Bid-ask spread is at most ${c.maxSpreadPct}% of the price. Checked only when the scan runs while the market is open; the start-up scan uses a finished session, so this filter is skipped.`],
    ])}
    <div class="tt-h">Step 2 · Score, 0 to 100 (ranks the stocks that passed)</div>
    ${rowsHtml([
      ['RVOL · up to 40', 'More points the higher the volume is against normal, up to RVOL 5.'],
      ['Relative ATR · 20, 10 or 0', '20 when the session\'s range is 1.2 to 2 times the stock\'s normal range; 10 for 0.8 to 1.2 or 2 to 3; 0 when quieter or more extreme than that.'],
      ['Strength vs Nifty · up to 25', 'How far the stock\'s day change is from Nifty 50\'s, in either direction, up to 3 percentage points. Lagging the index scores the same as leading it.'],
      ['Spread · 15, 10 or 0', '15 for 0.05% or tighter, 10 for up to 0.10%, 0 if wider or not checked. No stock gets these points from the start-up scan, so 85 is the most it can award.'],
    ])}
    <div class="tt-h">How each measure is calculated</div>
    <div class="tt-eq"><b>Traded value</b> = average of (close × volume) over the last ${c.baselineDays} sessions</div>
    <div class="tt-eq"><b>ATR%</b> = ATR(14) on daily candles ÷ previous close × 100</div>
    <div class="tt-eq"><b>RVOL</b> = session volume ÷ average volume of the previous ${c.rvolDays} sessions</div>
    <div class="tt-eq"><b>Relative ATR</b> = session true range ÷ average true range of the previous ${c.baselineDays} sessions</div>
    <div class="tt-eq"><b>Strength vs Nifty</b> = stock day change % − Nifty 50 day change %</div>
    <div class="tt-eq"><b>Spread %</b> = (ask − bid) ÷ ((ask + bid) ÷ 2) × 100</div>
    <div class="tt-h">Not used in the selection</div>
    ${list([
      'Gap %, change from open, and strength against stocks in the same industry are calculated and saved in the scan report, but do not filter or rank.',
      'Order-book depth, volume profile, news, and limits on how many stocks come from one sector are not checked.',
      'The live readings on this dashboard (RVOL now, order flow, VWAP and the rest) play no part in which stocks are listed.',
    ])}
    <div class="tt-h">Keep in mind</div>
    ${list([
      'The list reflects the previous session\'s activity. A stock that was busy yesterday may be quiet today; check its live RVOL here.',
      'Sessions with under a fifth of normal volume, such as Muhurat trading, are left out of the averages.',
      'The filter thresholds come from the strategy notes. The score weights are starting values and have not been backtested.',
      'Selection is a watchlist, not a signal to trade.',
    ])}
    <p class="tt-key">${source} Full results: Intraday Learning/StockSelection/scan-results/result.md.</p>`;
}

// One tooltip for all info icons. It lives outside the tiles, which are redrawn on every quote,
// so it stays put while the numbers behind it change.
let tileInfo = [];
let tipFor = null;
function formulaHtml(text) {
  // "A = B. C = D. Shown: note" -> one equation box per equation, then the note.
  const parts = text.split(/\.\s+(?=[A-Z])/);
  let html = '';
  for (const part of parts) {
    // "R1 = …, R2 = …" -> one box each. Other commas (such as "…, with k = …") stay in one box.
    const pieces = part.split(/,\s(?=[A-Z]\d?\s=)/);
    if (pieces.length > 1) { html += pieces.map((x) => formulaHtml(x)).join(''); continue; }
    const eq = part.match(/^(.+?)\s=\s(.+)$/);
    if (eq) html += `<div class="tt-eq"><b>${eq[1]}</b> = ${eq[2].replace(/\.$/, '')}</div>`;
    else html += `<div class="tt-note">${part.replace(/^Shown:\s*/, '')}</div>`;
  }
  return html;
}
function showTip(icon) {
  const key = icon.dataset.key; // "i:<tile>" formula, "how:<tile>" interpretation
  const [kind, n] = key.split(':');
  const info = tileInfo[Number(n)];
  const tip = $('tooltip');
  const sel = kind === 'sel'; // the side panel's "?"
  if (!info && !sel) return;
  const guide = kind === 'how' || sel;
  document.querySelector('#stocks .info.on')?.classList.remove('on');
  if (sel) icon.classList.add('on');
  if (tipFor !== key) {
    tip.innerHTML = sel
      ? `<div class="tt-kicker">How the stocks are selected</div><div class="tt-title">Stock selection</div>${selectionHtml()}`
      : guide
      ? `<div class="tt-kicker">How to interpret</div><div class="tt-title">${info.title}</div>${guideHtml(info.title)}`
      : `<div class="tt-kicker">How it's calculated</div><div class="tt-title">${info.title}</div>${formulaHtml(info.formula)}`;
    tip.classList.toggle('guide', guide);
    tip.scrollTop = 0;
    tipFor = key;
  }
  // Above the icon, right-aligned to it; dropped below only when there is no room above.
  const a = icon.getBoundingClientRect();
  const gap = 10;
  tip.style.maxHeight = '';
  let above;
  if (guide) {
    // Long text: use whichever side of the icon has more room, and scroll inside if it still doesn't fit.
    const roomAbove = a.top - gap - 8, roomBelow = window.innerHeight - a.bottom - gap - 8;
    above = tip.offsetHeight <= roomAbove || roomAbove >= roomBelow;
    tip.style.maxHeight = Math.max(160, above ? roomAbove : roomBelow) + 'px';
  }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (!guide) above = a.top - gap - h > 8 || a.bottom + gap + h > window.innerHeight - 8;
  const left = Math.max(12, Math.min(a.right + 14 - w, window.innerWidth - w - 12));
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, above ? a.top - gap - h : Math.min(a.bottom + gap, window.innerHeight - h - 8)) + 'px';
  tip.style.setProperty('--arrow-x', (a.left + a.width / 2 - left) + 'px');
  tip.classList.toggle('above', above);
  tip.classList.add('show');
}
function hideTip() {
  if (tipFor == null) return;
  tipFor = null;
  $('tooltip').classList.remove('show');
  document.querySelectorAll('.info.on').forEach((el) => el.classList.remove('on'));
}
// Click the icon to open its tooltip; click it again, click anywhere else, or press Escape to close.
document.addEventListener('click', (e) => {
  if (e.target.closest?.('#tooltip')) return; // reading or scrolling the open tooltip keeps it open
  const icon = e.target.closest?.('.info');
  if (!icon) { hideTip(); return; }
  e.preventDefault(); // the icon sits inside the tile link: don't navigate
  if (tipFor === icon.dataset.key) hideTip(); else showTip(icon);
  schedule();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('resize', hideTip);

// ---------- touch only (phones and tablets); mouse clicks never run this ----------
// The panel is redrawn on every quote. On a touch screen the browser sends the click a moment
// after the finger lifts, aimed at the element that was first touched; by then a redraw has
// usually replaced that element, so the tap is lost (or, on iOS, treated as a hover). So a
// finger tap is handled here directly: find what is under the finger now and act on it.
let touchStart = null;
let suppressClickUntil = 0;
function handleTap(el) {
  if (!el) return false;
  if (el.closest('#tooltip')) return true; // a tap inside the open tooltip keeps it open
  const icon = el.closest('.info');
  if (icon) {
    if (tipFor === icon.dataset.key) hideTip(); else showTip(icon);
    schedule();
    return true;
  }
  const stock = el.closest('#list button[data-sym]');
  if (stock) { hideTip(); select(stock.dataset.sym); return true; }
  const link = el.closest('#detail a[href^="#"]');
  if (link) {
    hideTip();
    const target = link.getAttribute('href');
    if (location.hash !== target && !(target === '#' && !location.hash)) location.hash = target; // fires hashchange
    return true;
  }
  hideTip();
  return false; // inputs and everything else behave normally
}
window.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') touchStart = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
}, true);
window.addEventListener('pointercancel', () => { touchStart = null; }, true); // the touch became a scroll
window.addEventListener('pointerup', (e) => {
  if (e.pointerType !== 'touch' || !touchStart || e.pointerId !== touchStart.id) return;
  const moved = Math.hypot(e.clientX - touchStart.x, e.clientY - touchStart.y);
  const held = performance.now() - touchStart.t;
  touchStart = null;
  if (moved > 10 || held > 600) return; // a swipe or a long press, not a tap
  if (handleTap(document.elementFromPoint(e.clientX, e.clientY))) suppressClickUntil = performance.now() + 700;
}, true);
// The browser's own follow-up click for a tap we already handled is dropped, so nothing fires twice.
document.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

// Redraws replace the elements under the pointer; one landing between press and release would
// swallow the click. So drawing waits while a mouse button or finger is down.
let pointerDown = false;
window.addEventListener('pointerdown', () => { pointerDown = true; });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, () => { pointerDown = false; schedule(); });

// Tiles and the back link are plain #links, so the browser's back button works between views.
window.addEventListener('hashchange', () => { hideTip(); view = viewFromHash(); remember('view', view); window.scrollTo(0, 0); schedule(); });

var dirty = false; // var: schedule() can be called before this line runs (restoring a closed sidebar)
function schedule() {
  if (dirty) return;
  dirty = true;
  requestAnimationFrame(() => {
    dirty = false;
    if (pointerDown) return; // redrawn on release
    renderStatus();
    renderList();
    try {
      renderDetail();
    } catch (err) {
      // Usually the page is newer than the running server, so fields it expects are missing.
      console.error(err);
      $('detail').innerHTML = '<p class="empty">This page is newer than the running dashboard server.<br>Stop the server (Ctrl+C) and start it again with <b>npm run dashboard</b>, then refresh.</p>';
    }
  });
}

let retry = 1000;
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { socketUp = true; retry = 1000; schedule(); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'snapshot') {
      order = msg.rows.map((r) => r.sym);
      msg.rows.forEach((r) => rows.set(r.sym, r));
      feed = msg.status;
      if (!selected || !order.includes(selected)) select(order.includes(recall('stock')) ? recall('stock') : order[0]); else loadCurves(selected);
    } else if (msg.type === 'row') {
      applyRow(msg.row);
    } else if (msg.type === 'curves') {
      if (selected) loadCurves(selected);
    } else if (msg.type === 'status') {
      feed = msg.status;
    }
    schedule();
  };
  ws.onclose = () => { socketUp = false; schedule(); setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
}
connect();
// Keep --header-h equal to the header's real height, so the pinned stock list sits just below it.
const setHeaderHeight = () => document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
setHeaderHeight();
new ResizeObserver(setHeaderHeight).observe(document.querySelector('header'));
setInterval(renderStatus, 5000);
// Order-flow and book charts gain a point every minute; refresh them while a section is open.
setInterval(() => { if (selected && view && socketUp && document.visibilityState === 'visible') loadCurves(selected); }, 60000);
window.addEventListener('resize', schedule);
</script>
</body>
</html>
