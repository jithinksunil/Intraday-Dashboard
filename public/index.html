<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #15181d; --muted: #68707d;
    --accent: #2f6fed; --up: #10895a; --down: #c8372d; --hot: #b45309; --hover: #f0f3f8; --avg: #9aa3b2; --tip-bg: #ffffff; --good: #0e8f8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #272d36; --text: #e8ebf0; --muted: #8b95a5;
      --accent: #6b9bff; --up: #3ecf8e; --down: #ff7a6e; --hot: #f5a524; --hover: #1e242c; --avg: #6a7484; --tip-bg: #1f252e; --good: #4fd1c5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.live::before { background: var(--up); }
  #status.down::before { background: var(--down); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  /* The header stays at the top while scrolling, and the stock list stays pinned just below it.
     --header-h is the header's measured height, kept current by the script. */
  header { position: sticky; top: 0; z-index: 10; }
  nav.panel { position: sticky; top: calc(var(--header-h, 57px) + 16px); align-self: start; max-height: calc(100vh - var(--header-h, 57px) - 32px); overflow-y: auto; }
  main.closed { grid-template-columns: 1fr; }
  main.closed nav { display: none; }
  .head-right { display: flex; align-items: center; gap: 18px; }
  .risk { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .risk-box { display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); }
  .risk-box:focus-within { border-color: var(--accent); }
  .risk input { width: 78px; border: 0; background: none; color: inherit; font: inherit; font-variant-numeric: tabular-nums; outline: none; }
  .ladder { display: grid; gap: 6px; margin: 4px 0 18px; }
  .ladder div { display: flex; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
  .ladder .t { border-left: 3px solid var(--up); } .ladder .e { border-left: 3px solid var(--accent); } .ladder .s { border-left: 3px solid var(--down); }
  .head-left { display: flex; align-items: center; gap: 12px; }
  #toggle { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  #toggle:hover { background: var(--hover); }
  #toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #list { list-style: none; margin: 0; padding: 6px; }
  #list button {
    width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    padding: 9px 10px; border: 0; border-radius: 7px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  #list button:hover { background: var(--hover); }
  #list button[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
  #list button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .pill { min-width: 58px; text-align: right; font-weight: 600; }
  .pill.excellent { color: var(--up); }
  .pill.verygood { color: var(--good); }
  .pill.good { color: var(--accent); }
  .pill.average { color: var(--hot); }
  .pill.bad, .pill.none { color: var(--muted); font-weight: 500; }
  #detail { padding: 20px 22px; min-height: 420px; }
  #detail h2 { margin: 0; font-size: 20px; }
  .price { color: var(--muted); margin-top: 2px; }
  .hero { display: flex; align-items: baseline; gap: 12px; margin: 22px 0 4px; }
  .hero .big { font-size: 54px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; }
  .hero .label { color: var(--muted); }
  .verdict { margin: 0 0 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .chart-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; background: var(--accent); }
  .legend .avg::before { background: var(--avg); }
  svg { max-width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .l-avg { fill: none; stroke: var(--avg); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .l-today { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
  .l-vwap { fill: none; stroke: var(--hot); stroke-width: 1.5; }
  .legend .vw::before { background: var(--hot); }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .jump a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }
  .jump a:hover, .jump a:focus-visible { color: var(--text); border-color: var(--accent); outline: none; }
  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 0 0 6px; }
  .split .b { background: var(--up); } .split .a { background: var(--down); }
  .split-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  table.book { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.book th { color: var(--muted); font-size: 12px; font-weight: 500; padding: 4px 8px; text-align: right; }
  table.book td { padding: 5px 8px; text-align: right; position: relative; }
  table.book td.px { font-weight: 600; }
  table.book td.bid.px { color: var(--up); } table.book td.ask.px { color: var(--down); }
  table.book td.ask, table.book th.ask { text-align: left; }
  table.book .bar { position: absolute; top: 2px; bottom: 2px; opacity: 0.16; border-radius: 3px; }
  table.book td.bid .bar { right: 0; background: var(--up); } table.book td.ask .bar { left: 0; background: var(--down); }
  table.book td span { position: relative; }
  .tag { display: inline-block; font-size: 12px; color: var(--hot); border: 1px solid var(--hot); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  table.levels { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.levels th { color: var(--muted); font-size: 12px; font-weight: 500; padding: 4px 8px; text-align: right; }
  table.levels th:first-child, table.levels td:first-child { text-align: left; }
  table.levels td { padding: 6px 8px; text-align: right; border-top: 1px solid var(--line); }
  table.levels tr.now td { background: var(--hover); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .group { margin-top: 22px; }
  .group-title { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .group-title a { color: var(--muted); text-decoration: none; }
  .group-title a:hover, .group-title a:focus-visible { color: var(--accent); outline: none; }
  .tile { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .12s, background .12s; }
  .tile:hover { background: var(--hover); border-color: var(--accent); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile-title { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 600; }
  .tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin-top: 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile { position: relative; }
  .info { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; flex: none; border: 1px solid var(--muted); border-radius: 50%; font-size: 11px; font-weight: 700; font-style: italic; font-family: Georgia, serif; }
  .info { position: relative; }
  .info::after { content: ""; position: absolute; inset: -11px; }
  .info { transition: color .12s, border-color .12s, background .12s; }
  .info:hover, .info.on { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #tooltip { position: fixed; z-index: 20; width: max-content; max-width: min(360px, calc(100vw - 24px)); padding: 12px 14px 13px; border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 10px; background: var(--tip-bg); color: var(--text); box-shadow: 0 12px 32px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .2); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease; visibility: hidden; }
  #tooltip.show { opacity: 1; transform: none; visibility: visible; }
  #tooltip::before { content: ""; position: absolute; left: var(--arrow-x, 20px); width: 10px; height: 10px; background: var(--tip-bg); border-left: 1px solid var(--line); border-top: 2px solid var(--accent); transform: translateX(-50%) rotate(45deg); top: -7px; }
  #tooltip.above::before { top: auto; bottom: -6px; border: 0; border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
  #tooltip.above { border-top: 1px solid var(--line); border-bottom: 2px solid var(--accent); transform: translateY(-4px); }
  #tooltip.above.show { transform: none; }
  #tooltip .tt-kicker { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #tooltip .tt-title { font-size: 14px; font-weight: 650; margin: 2px 0 9px; }
  #tooltip .tt-eq { font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
  #tooltip .tt-eq + .tt-eq { margin-top: 6px; }
  #tooltip .tt-eq b { color: var(--accent); font-weight: 600; }
  #tooltip .tt-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) { #tooltip { transition: none; transform: none; } }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; letter-spacing: .01em; vertical-align: middle; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 13%, transparent); }
  .badge.excellent { color: var(--up); }
  .badge.verygood { color: var(--good); }
  .badge.good { color: var(--accent); }
  .badge.average { color: var(--hot); }
  .badge.bad, .badge.sell { color: var(--down); }
  .badge.buy { color: var(--up); }
  .badge.neutral { color: var(--muted); }
  .badge.weak { border-style: dashed; background: none; font-weight: 600; }
  .tile.rated.weak { border-left-style: dashed; }
  .tile-rating { margin-top: 10px; min-height: 22px; }
  .tile.rated { border-left: 3px solid var(--line); }
  .tile.rated.excellent { border-left-color: var(--up); }
  .tile.rated.verygood { border-left-color: var(--good); }
  .tile.rated.good { border-left-color: var(--accent); }
  .tile.rated.average { border-left-color: var(--hot); }
  .tile.rated.bad, .tile.rated.sell { border-left-color: var(--down); }
  .tile.rated.buy { border-left-color: var(--up); }
  .tile.rated.neutral { border-left-color: var(--muted); }
  .zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .zone { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .zone-kind { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .zone-range { font-size: 18px; font-weight: 650; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .zone ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .zone ul.checks { list-style: none; padding-left: 0; margin-top: 8px; color: var(--text); }
  .zone ul.checks li { padding: 2px 0; }
  .chk { display: inline-block; width: 18px; font-weight: 700; text-align: center; }
  .chk.yes { color: var(--up); } .chk.no { color: var(--down); } .chk.na { color: var(--muted); }
  .zone-text { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .tile-label { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile-verdict { margin: 10px 0 0; font-size: 13px; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); text-decoration: none; font-size: 13px; }
  .back:hover { text-decoration: underline; }
  .jump a[aria-current="page"] { color: var(--text); border-color: var(--accent); }
  .metric .hero { margin-top: 20px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  /* ---------- phones and narrow windows ---------- */
  @media (max-width: 760px) {
    header { position: static; flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; }
    #toggle { display: none; }
    .head-right { width: 100%; justify-content: space-between; gap: 10px; }
    .risk { font-size: 12px; gap: 6px; flex: none; }
    .risk input { width: 64px; font-size: 16px; } /* 16px stops iOS zooming in on focus */
    #status { min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status::before { flex: none; }
    main, main.closed { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; }
    /* The stock list becomes a swipeable strip that stays at the top while scrolling. */
    main.closed nav { display: block; }
    nav.panel { position: sticky; top: 0; z-index: 4; max-height: none; overflow: visible; border-radius: 10px; box-shadow: 0 6px 14px rgba(0, 0, 0, .18); }
    #list { display: flex; gap: 6px; padding: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #list::-webkit-scrollbar { display: none; }
    #list li { flex: none; }
    #list button { grid-template-columns: auto auto; gap: 1px 10px; padding: 7px 11px; min-width: 112px; }
    #list button > :first-child { grid-column: 1 / -1; }
    #list button > :first-child br { display: none; }
    #list button > :first-child .name { margin-right: 6px; }
    #list button[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
    .pill { min-width: 0; }
    #detail { padding: 14px 12px; min-height: 0; }
    #detail h2 { font-size: 18px; }
    .back { padding: 6px 0; margin-bottom: 6px; }
    .jump { flex-wrap: nowrap; overflow-x: auto; margin: 12px -12px 0; padding: 0 12px 4px; scrollbar-width: none; }
    .jump::-webkit-scrollbar { display: none; }
    .jump a { flex: none; white-space: nowrap; padding: 7px 12px; font-size: 13px; }
    .group { margin-top: 18px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 11px 12px; }
    .tile-title { gap: 6px; }
    .tile-value { font-size: 20px; margin-top: 8px; }
    .tile-label { font-size: 11px; }
    .tile-rating { margin-top: 8px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .hero { flex-wrap: wrap; gap: 4px 10px; margin: 16px 0 4px; }
    .hero .big { font-size: 38px; }
    .metric .hero { margin-top: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
    .stat { padding: 9px 10px; }
    .stat .v { font-size: 15px; overflow-wrap: anywhere; }
    .chart-head { flex-wrap: wrap; gap: 4px 12px; }
    .legend { flex-wrap: wrap; gap: 4px 12px; }
    .ladder div { gap: 10px; align-items: baseline; }
    .ladder .sub { display: block; }
    table.book, table.levels { font-size: 13px; }
    table.book th, table.book td, table.levels th, table.levels td { padding: 6px 5px; }
    /* Order counts are dropped on a phone so price and quantity fit. */
    table.book tr > :first-child, table.book tr > :last-child { display: none; }
    table.levels .sub { display: block; }
    #tooltip { max-width: calc(100vw - 20px); }
    /* No double-tap zoom delay and no grey flash on tappable things. */
    #list button, .tile, .jump a, .back, .group-title a, .info { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #list { touch-action: pan-x; }
  }
  @media (max-width: 360px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="head-left">
    <button id="toggle" type="button" aria-controls="stocks" aria-expanded="true">☰ <span id="toggle-text">Hide stocks</span></button>
    <h1>Trading dashboard</h1>
  </div>
  <div class="head-right">
    <label class="risk">Max risk per trade <span class="risk-box">₹<input id="max-risk" type="number" min="1" step="100" inputmode="decimal" aria-describedby="risk-help"></span></label>
    <span id="risk-help" hidden>Used by the Execution section to size positions.</span>
    <div id="status" role="status">Connecting…</div>
  </div>
</header>
<main>
  <nav class="panel" id="stocks" aria-label="Stocks"><ul id="list"></ul></nav>
  <section class="panel" id="detail" aria-live="polite"><p class="empty">Waiting for data…</p></section>
</main>
<div id="tooltip" role="tooltip"></div>
<script>
const rows = new Map();          // sym -> latest row
let order = [];                  // symbols in config order
let selected = null;
let curves = null;               // { sym, average, today } for the selected symbol
let feed = { feed: 'connecting' };
let socketUp = false;

const $ = (id) => document.getElementById(id);
const short = (sym) => sym.replace(/^[A-Z]+:/, '').replace(/-EQ$/, '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const price = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const compact = new Intl.NumberFormat('en-IN', { notation: 'compact', maximumFractionDigits: 2 });
const fmt = (f, v) => (v == null ? '–' : f.format(v));
const fmtRvol = (v) => (v == null ? '–' : v.toFixed(2) + '×');
const clock = (ms) => new Date(ms).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
const dayText = (ms) => new Date(ms).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
const istDay = (ms) => Math.floor((ms + 19800000) / 86400000);

function verdict(v) {
  if (v == null) return '';
  if (v >= 2) return 'Volume is running at more than twice its usual pace for this time of day.';
  if (v >= 1.5) return 'Volume is well above its usual pace for this time of day.';
  if (v >= 1.1) return 'Volume is a little above its usual pace for this time of day.';
  if (v >= 0.9) return 'Volume is in line with its usual pace for this time of day.';
  if (v >= 0.7) return 'Volume is a little below its usual pace for this time of day.';
  return 'Volume is well below its usual pace for this time of day.';
}

function renderStatus() {
  const el = $('status');
  const newest = Math.max(0, ...[...rows.values()].map((r) => r.asOf ?? 0));
  el.className = '';
  if (!socketUp) { el.textContent = 'Dashboard server not reachable. Retrying…'; el.className = 'down'; return; }
  if (feed.feed !== 'connected') { el.textContent = feed.feed === 'connecting' ? 'Connecting to Fyers…' : 'Fyers feed disconnected. Reconnecting…'; el.className = 'down'; return; }
  if (!newest) { el.textContent = 'Connected. Waiting for the first quotes…'; return; }
  if (Date.now() - newest < 60000) { el.textContent = 'Live · ' + clock(newest) + ' IST'; el.className = 'live'; return; }
  // Before 09:15 on a trading day Fyers has already reset volume, VWAP and day change for the new session.
  const mins = (ms) => { const d = new Date(ms + 19800000); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
  if (istDay(newest) === istDay(Date.now()) && mins(Date.now()) < 555) {
    el.textContent = 'Before market open · today\'s volume and VWAP start at 09:15 IST';
    return;
  }
  el.textContent = 'Market closed · showing ' + dayText(newest) + ', ' + clock(newest) + ' IST';
}

function renderList() {
  $('list').innerHTML = order.map((sym) => {
    const r = rows.get(sym) ?? {};
    const chg = r.changePct;
    return `<li><button data-sym="${esc(sym)}" aria-current="${sym === selected}">

/** Line chart over the 375 session minutes. lines: [{ data, cls }]; fromZero pins the y-axis at 0. */
let drawCharts = true;
function chartSvg(lines, { fromZero, format, label, range, guides = [] }) {
  if (!drawCharts) return '';
  // Drawn at the panel's real pixel width so a wide page gives a wider chart, not a taller one.
  const pad = parseFloat(getComputedStyle($('detail')).paddingLeft) || 0;
  const W = Math.max(280, $('detail').clientWidth - 2 * pad), H = 240, L = 58, R = 10, T = 10, B = 24, N = 375;
  const vals = lines.flatMap((l) => (l.data ?? []).filter((v) => v != null));
  if (!vals.length) return '<p class="empty">No data for this session yet.</p>';
  let min = fromZero ? 0 : Math.min(...vals), max = Math.max(...vals);
  if (range) { [min, max] = range; }
  else {
    for (const g of guides) { const v = typeof g === 'number' ? g : g.v; min = Math.min(min, v); max = Math.max(max, v); }
    if (max === min) { max += 1; min -= fromZero ? 0 : 1; }
    if (!fromZero) { const pad = (max - min) * 0.08; min -= pad; max += pad; }
  }
  const x = (i) => L + (i / (N - 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const path = (arr) => { let d = '', pen = false; arr.forEach((v, i) => { if (v == null) return; d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; }); return d; };
  guides = guides.map((g) => (typeof g === 'number' ? { v: g, label: format(g) } : g));
  const guideLines = guides.map((g) => `<line class="guide" x1="${L}" x2="${W - R}" y1="${y(g.v)}" y2="${y(g.v)}"/><text x="${W - R}" y="${y(g.v) - 4}" text-anchor="end">${g.label}</text>`).join('');
  const yTicks = [0, 0.5, 1].map((f) => { const v = min + (max - min) * f; return `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${format(v)}</text>`; }).join('');
  const xTicks = [[0, '09:15'], [105, '11:00'], [225, '13:00'], [374, '15:30']].map(([i, t]) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 374 ? 'end' : 'middle'}">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${label}">
    ${yTicks}${xTicks}${guideLines}
    ${lines.map((l) => (l.data ? `<path class="${l.cls}" d="${path(l.data)}"/>` : '')).join('')}
  </svg>`;
}

const fmtAtr = (v) => (v == null ? '–' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' ATR');
// How a normalized VWAP deviation is used: which kind of setup it is a candidate for.

function vwapZones(d) {
  if (d == null) return [];
  if (Math.abs(d) <= 0.5) return [{ kind: 'No-trade / neutral zone', tag: null, tone: 'neutral', range: '−0.5 to +0.5', points: ['Price is close to VWAP.', 'Avoid treating small deviations as meaningful opportunities.'] }];
  const below = d < 0;
  const side = below ? 'below' : 'above';
  const zones = [];
  if (Math.abs(d) > 1.5) {
    zones.push({ kind: 'Mean-reversion candidate', tag: 'Watch for reversal', tone: 'excellent', range: (below ? 'Below −1.5' : 'Above +1.5'), points: [
      `Price is significantly ${side} VWAP.`,
      `Look for weakening ${below ? 'selling' : 'buying'} pressure.`,
      `Check absorption and ${below ? 'buying' : 'selling'} response.`,
      'Wait for reversal confirmation.',
    ] });
  }
  if (Math.abs(d) > 1) {
    zones.push({ kind: 'Momentum candidate', tag: 'Watch for continuation', tone: 'good', range: (below ? 'Below −1.0' : 'Above +1.0'), points: [
      `Price is ${side} VWAP.`,
      `${below ? 'Downward' : 'Upward'} trend is confirmed.`,
      `${below ? 'Selling' : 'Buying'} pressure persists.`,
      `Look for ${below ? 'bearish' : 'bullish'} continuation rather than ${below ? 'buying' : 'selling'} simply because price is extended.`,

}

// Ratings: how good a metric's current value is. Each rule lists bands in order; the first band

    { below: 2, grade: 'good', label: 'Good' },                       // 1.5 to under 2
    { below: 3, grade: 'verygood', label: 'Very good' },              // 2 to under 3

  relAtr: [

    { below: 1, grade: 'bad', label: 'Normal · avoid' },           // 0.8 to under 1
    { below: 1.2, grade: 'good', label: 'Normal · good' },         // 1 to under 1.2
    { below: 1.5, grade: 'verygood', label: 'Very good' },         // 1.2 to under 1.5 (elevated)

  rsi: [

    { below: 40, grade: 'sell', label: 'Normal bearish ↓', text: 'normal bearish momentum, downward' },         // 30 to under 40
    { below: 50, grade: 'sell weak', label: 'Weak bearish ↓', text: 'weak bearish momentum, downward' },        // 40 to under 50

function rate(metric, value) {
  if (value == null || !RATINGS[metric]) return null;
  return RATINGS[metric].find((band) => (band.below != null ? value < band.below : value <= band.upTo)) ?? null;
}
const rateVwapDev = (v) => (v == null ? null : rate('vwapDevAtr', Math.abs(v)));
/** Rating for a normalized EMA slope: quality from its size, wording from its direction. */
function rateEmaSlope(v) {
  if (v == null) return null;
  const band = rate('emaSlopeNorm', Math.abs(v));
  const dir = v > 0 ? 'bullish' : 'bearish';
  if (band.label === 'Avoid') return { ...band, label: 'Avoid · no clear trend', slopeText: 'Flat / neutral' };
  const label = band.label === 'Excellent' ? `Excellent · strong ${dir} trend` : band.label === 'Good' ? `Good ${dir} candidate` : `Weak ${dir} trend · avoid`;
  return { ...band, label, slopeText: `${band.slope} ${dir} slope` };
}
const badge = (rating) => (rating ? `<span class="badge ${rating.grade}">${rating.label}</span>` : '');

// The EMA slope is measured over this many candles (must match SLOPE_BARS in src/lib/rvolEngine.js).
// Dividing the slope by it gives the average change per candle.
const EMA_SLOPE_CANDLES = 5;

// Execution plan for a long trade entered at the last price.
const STOP_ATR_MULT = 1.5; // stop distance = 1.5 x ATR
const REWARD_MULT = 2;     // target = entry + 2 x stop distance, i.e. risk:reward 1:2
let maxRisk = 1000;
try { const saved = Number(localStorage.getItem('maxRisk')); if (saved > 0) maxRisk = saved; } catch { /* storage unavailable */ }
function tradePlan(r) {
  if (r.ltp == null || !r.atr5) return null;
  const entry = r.ltp;
  const stopDistance = STOP_ATR_MULT * r.atr5;
  const qty = Math.floor(maxRisk / stopDistance); // whole shares, rounded down so risk stays within the limit
  return { entry, stopDistance, stopLoss: entry - stopDistance, target: entry + REWARD_MULT * stopDistance, qty, capital: qty * entry, risk: qty * stopDistance, reward: qty * REWARD_MULT * stopDistance };
}

const viewFromHash = () => { const id = location.hash.slice(1); return SECTIONS.some(([s]) => s === id) ? id : null; };

const remember = (key, value) => { try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch { /* storage unavailable */ } };
const recall = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
if (!location.hash && SECTIONS.some(([s]) => s === recall('view'))) history.replaceState(null, '', '#' + recall('view'));
let view = viewFromHash(); // null = tile overview, otherwise the id of the section being shown

        <div class="stat"><div class="k">Normalized VWAP deviation</div><div class="v num ${r.vwapDevAtr == null ? '' : r.vwapDevAtr >= 0 ? 'up' : 'down'}">${fmtAtr(r.vwapDevAtr)}</div><div class="k">${badge(rateVwapDev(r.vwapDevAtr))} ${r.vwapDevAtr == null ? '' : rateVwapDev(r.vwapDevAtr).text}</div><div class="k">${r.vwapDevAtr == null ? '' : rate('vwapInterp', r.vwapDevAtr).label}</div><div class="k">range: &lt; 0 below VWAP · 0 at VWAP · &gt; 0 above VWAP</div></div>

      <p class="note">VWAP is the average price paid today, weighted by volume. It comes from the exchange feed and resets each morning. Normalized VWAP deviation = (price − VWAP) ÷ 5-minute ATR(14), so it shows the distance in units of the stock's own recent movement. 0 is the base: price exactly at VWAP. It can be less than 0 (price below VWAP) or greater than 0 (price above VWAP), with no fixed limit either way. Classification by distance from VWAP, either side: below 0.5 avoid (no deviation-based setup) · 0.5–1.0 moderate (lower priority) · 1.0–1.5 good candidate (evaluate setup) · above 1.5 excellent candidate (strongly consider for evaluation). Ranges: within ±0.5 close to VWAP (no-trade zone) · 0.5–1.0 moderately · 1.0–1.5 significantly · 1.5–2.0 strongly extended · beyond 2.0 extremely extended, above or below. Beyond ±1.0 is a momentum candidate; beyond ±1.5 is also a mean-reversion candidate. These are initial research thresholds, not validated trading levels.</p>

      <p class="note">True range is the largest of a candle's high − low and its gaps from the previous close. ATR is its 14-candle average. ATR % = ATR ÷ price, which makes stocks comparable. Relative ATR = ATR ÷ the average ATR at the same time of day over the last 20 sessions; 1× is normal for this time of day. It is a ratio of two ATRs, so it is always positive and says nothing about direction: above 1 means more movement than usual, below 1 means less. Ratings: under 0.8 bad · 0.8–1 normal, avoid · 1–1.2 normal, good · 1.2–1.5 very good · 1.5–2 exceptional · 2–3 very high, avoid · above 3 extreme, avoid. These use completed 5-minute candles and refresh every 5 minutes.</p>

    <div class="metric" id="s-momentum">

      <p class="verdict">${r.roc == null ? 'Not enough candles yet to calculate the rate of change.' : `Price is ${Math.abs(r.roc).toFixed(2)}% ${r.roc >= 0 ? 'higher' : 'lower'} than 50 minutes ago.`} ${rsiVerdict(r.rsi)}</p>
      <div class="stats">
        <div class="stat"><div class="k">Rate of change (10 candles)</div><div class="v num ${r.roc == null ? '' : r.roc >= 0 ? 'up' : 'down'}">${signed(r.roc)}${r.roc == null ? '' : '%'}</div><div class="k">compares price with 50 minutes ago</div></div>
        <div class="stat"><div class="k">RSI (14)</div><div class="v num">${r.rsi == null ? '–' : r.rsi.toFixed(1)} ${badge(rate('rsi', r.rsi))}</div><div class="k">base 50 = gains and losses equal · below 50 bearish · above 50 bullish · range 0 to 100</div></div>

      <div class="chart-head" style="margin-top:18px"><h3>RSI through the session</h3><div class="legend"><span>RSI</span></div></div>

      <p class="note">Rate of change = how far price has moved, in percent, over the last 10 five-minute candles. Positive means momentum is up. RSI (0 to 100) compares the size of recent gains with recent losses over 14 candles. 50 is the base: recent gains and losses are the same size. Below 50 means losses have been larger than gains (bearish, downward momentum); above 50 means gains have been larger (bullish, upward momentum). The further from 50, the stronger. RSI ratings: under 30 strong bearish · 30–40 normal bearish · 40–50 weak bearish · 50–60 weak bullish · 60–70 normal bullish · above 70 strong bullish. Both headline values include the candle now forming, using the last price; the charts show completed candles.</p>

    <div class="metric" id="s-trend">
      <div class="hero"><span class="big num ${r.emaSlopePct == null ? '' : r.emaSlopePct >= 0 ? 'up' : 'down'}">${signed(r.emaSlopePct, 3)}${r.emaSlopePct == null ? '' : '%'}</span><span class="label">EMA slope (20-candle EMA, 5-min) ${badge(rateEmaSlope(emaSlopePerCandle(r)))}</span></div>
      <p class="verdict">${trendVerdict(r.emaSlopePct, r.priceVsEmaPct)}</p>
      <div class="stats">
        <div class="stat"><div class="k">EMA (20)</div><div class="v num">${r.ema == null ? '–' : '₹' + price.format(r.ema)}</div></div>
        <div class="stat"><div class="k">EMA slope %</div><div class="v num ${r.emaSlopePct == null ? '' : r.emaSlopePct >= 0 ? 'up' : 'down'}">${signed(r.emaSlopePct, 3)}${r.emaSlopePct == null ? '' : '%'}</div></div>

        <div class="stat"><div class="k">Price vs EMA</div><div class="v num ${r.priceVsEmaPct == null ? '' : r.priceVsEmaPct >= 0 ? 'up' : 'down'}">${signed(r.priceVsEmaPct)}${r.priceVsEmaPct == null ? '' : '%'}</div></div>

      <div class="chart-head"><h3>How the engine uses the EMA slope right now</h3></div>
      <div class="zones">${trendZoneHtml(r)}</div>

      ${c ? chartSvg([{ data: c.emaCurve, cls: 'l-vwap' }, { data: c.price, cls: 'l-today' }], { format: (v) => price.format(v), label: 'Price against its 20-candle EMA through the session' }) : '<p class="empty">Loading chart…</p>'}
      <div class="chart-head" style="margin-top:18px"><h3>EMA slope through the session</h3><div class="legend"><span>Slope %</span></div></div>
      ${c ? chartSvg([{ data: c.slopeCurve, cls: 'l-today' }], { guides: [0], format: (v) => v.toFixed(3), label: 'EMA slope through the session with zero marked' }) : '<p class="empty">Loading chart…</p>'}
      <p class="note">EMA is an average of the last 20 five-minute closes that gives recent candles more weight. EMA slope % = how much the EMA itself has changed over the last 5 candles (25 minutes): positive means the trend is rising, near zero means it is flattening. Normalized EMA slope % = EMA slope % ÷ 5, the average change in the EMA per candle. Ratings by size, in either direction: within ±0.005% avoid (flat, no clear trend) · 0.005–0.02% weak, avoid · 0.02–0.05% good candidate · above 0.05% excellent (strong trend). Headline values include the candle now forming; the charts show completed candles.</p>
    </div>

    <div class="metric" id="s-book">
      <div class="hero"><span class="big num ${r.imbalance5 == null ? '' : r.imbalance5 >= 0 ? 'up' : 'down'}">${signed(r.imbalance5)}</span><span class="label">order book imbalance (top 5 levels)${r.book && !r.bookLive ? '<span class="tag">market closed</span>' : ''}</span></div>
      <p class="verdict">${imbalanceVerdict(r.imbalance5, r.bookLive)}</p>
      ${r.imbalance5 == null ? '' : `<div class="split" role="img" aria-label="Share of quantity on the buy and sell side"><div class="b" style="width:${(((1 + r.imbalance5) / 2) * 100).toFixed(1)}%"></div><div class="a" style="flex:1"></div></div>
      <div class="split-labels"><span>Buy ${qty.format(r.bidQty5)}</span><span>Sell ${qty.format(r.askQty5)}</span></div>`}
      <div class="stats">
        <div class="stat"><div class="k">Spread %</div><div class="v num">${r.spreadPct == null ? '–' : r.spreadPct.toFixed(4) + '%'} ${badge(rate('spreadPct', r.spreadPct))}</div><div class="k">0–0.05% excellent · 0.05–0.1% very good · above 0.1% bad, not considered</div></div>
        <div class="stat"><div class="k">Spread scale</div><div class="v num" style="font-size:14px"><b>0 = no gap</b> · wider →</div><div class="k">never below 0 · usually below 0.2% · above 0.1% is not considered</div></div>
        <div class="stat"><div class="k">Spread (₹)</div><div class="v num">${r.spread == null ? '–' : '₹' + price.format(r.spread)}</div></div>
        <div class="stat"><div class="k">Imbalance, top 5 levels</div><div class="v num ${r.imbalance5 == null ? '' : r.imbalance5 >= 0 ? 'up' : 'down'}">${signed(r.imbalance5)} ${r.bookLive ? badge(rate('imbalance', r.imbalance5)) : ''}</div></div>
        <div class="stat"><div class="k">Imbalance, whole book</div><div class="v num ${r.imbalanceBook == null ? '' : r.imbalanceBook >= 0 ? 'up' : 'down'}">${signed(r.imbalanceBook)} ${r.bookLive ? badge(rate('imbalance', r.imbalanceBook)) : ''}</div></div>

      <div class="chart-head"><h3>Order book depth (best 5 levels each side)</h3></div>
      ${bookTable(r.book)}
      <p class="note">Spread % = (best ask − best bid) ÷ their midpoint: the cost of crossing the book. 0 is the base: no gap between buyers and sellers. It can never go below 0 and has no fixed upper limit, but it is usually under 0.2%. Anything above 0.1% is rated bad and not considered for a trade. Imbalance = (buy quantity − sell quantity) ÷ (buy + sell), from −1 (all sellers) to +1 (all buyers). "Whole book" uses the exchange's total buy and sell quantity across every level. Displayed orders can be cancelled at any time, so treat imbalance as a hint, not proof of buying or selling.</p>
    </div>

    <div class="metric" id="s-levels">
      <div class="hero"><span class="big num">${r.support && r.resistance ? '₹' + price.format(r.support.price) + ' – ₹' + price.format(r.resistance.price) : r.pivots ? '₹' + price.format(r.pivots.p) : '–'}</span><span class="label">${r.support && r.resistance ? 'support – resistance range (pivot points)' : 'pivot point'}</span></div>
      <p class="verdict">${levelsVerdict(r)}</p>

        <div class="stat"><div class="k">Pivot</div><div class="v num">₹${price.format(r.pivots.p)}</div></div>
        <div class="stat"><div class="k">Previous session H / L / C</div><div class="v num" style="font-size:14px">${price.format(r.prevDay.h)} / ${price.format(r.prevDay.l)} / ${price.format(r.prevDay.c)}</div></div>
      </div>
      <div class="chart-head"><h3>Price against pivot levels</h3><div class="legend"><span>Price</span></div></div>
      ${c ? chartSvg([{ data: c.price, cls: 'l-today' }], { guides: [{ v: r.pivots.s1, label: 'S1' }, { v: r.pivots.p, label: 'Pivot' }, { v: r.pivots.r1, label: 'R1' }], format: (v) => price.format(v), label: 'Price through the session against the pivot, S1 and R1' }) : '<p class="empty">Loading chart…</p>'}
      <div class="chart-head" style="margin-top:18px"><h3>All pivot levels</h3></div>
      ${levelsTable(r)}` : ''}
      <p class="note">Pivot = (previous high + low + close) ÷ 3. R1 = 2 × pivot − low, S1 = 2 × pivot − high, R2/S2 = pivot ± (high − low), R3 = high + 2 × (pivot − low), S3 = low − 2 × (high − pivot). The levels are fixed for the whole session; only the price moves. They are reference zones where price may stall or reverse, not guaranteed turning points.</p>
    </div>

    <div class="metric" id="s-swings">

      <p class="verdict">${swingVerdict(r)}</p>
      <div class="stats">
        ${swingCard('Last swing low (support)', r.swingLow, r.asOf)}
        ${swingCard('Last swing high (resistance)', r.swingHigh, r.asOf)}
      </div>
      <div class="chart-head"><h3>Price against the last swing levels</h3><div class="legend"><span>Price</span></div></div>
      ${c ? chartSvg([{ data: c.price, cls: 'l-today' }], { guides: [r.swingLow && { v: r.swingLow.price, label: 'Swing low' }, r.swingHigh && { v: r.swingHigh.price, label: 'Swing high' }].filter(Boolean), format: (v) => price.format(v), label: 'Price through the session against the last swing high and low' }) : '<p class="empty">Loading chart…</p>'}
      <div class="chart-head" style="margin-top:18px"><h3>Recent swings (newest first)</h3></div>
      ${swingTable(r)}
      <p class="note">A swing high is a 5-minute candle whose high is the highest of 5 candles: itself and the 2 on each side. A swing low is the same with lows. The last swing high acts as resistance and the last swing low as support. A swing is only confirmed 2 candles later, so the newest one is at least 10 minutes old. These refresh every 5 minutes; the distances update live.</p>
    </div>

    <div class="metric" id="s-exec">
      <div class="hero"><span class="big num">${plan ? qty.format(plan.qty) : '–'}</span><span class="label">shares to buy (position size) for a max risk of ₹${qty.format(maxRisk)}</span></div>
      <p class="verdict">${plan ? `Buying at ₹${price.format(plan.entry)} with a stop at ₹${price.format(plan.stopLoss)} and a target at ₹${price.format(plan.target)}. If the stop is hit you lose about ₹${qty.format(Math.round(plan.risk))}; at the target you make about ₹${qty.format(Math.round(plan.reward))}.` : 'Needs a last price and an ATR to plan a trade.'}</p>
      ${plan ? `<div class="ladder">
        <div class="t"><span>Target price <span class="sub">entry + 2 × stop distance</span></span><b>₹${price.format(plan.target)}</b></div>
        <div class="e"><span>Entry price <span class="sub">last price</span></span><b>₹${price.format(plan.entry)}</b></div>
        <div class="s"><span>Stop loss <span class="sub">entry − stop distance</span></span><b>₹${price.format(plan.stopLoss)}</b></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Stop distance</div><div class="v num">₹${price.format(plan.stopDistance)}</div><div class="k num">1.5 × ATR of ₹${price.format(r.atr5)}</div></div>
        <div class="stat"><div class="k">Position size</div><div class="v num">${qty.format(plan.qty)} shares</div><div class="k num">₹${qty.format(maxRisk)} ÷ ₹${price.format(plan.stopDistance)}</div></div>
        <div class="stat"><div class="k">Capital needed</div><div class="v num">₹${qty.format(Math.round(plan.capital))}</div><div class="k num">shares × entry price</div></div>
        <div class="stat"><div class="k">Risk : reward</div><div class="v num">1 : 2</div><div class="k num">₹${qty.format(Math.round(plan.risk))} : ₹${qty.format(Math.round(plan.reward))}</div></div>
      </div>` : ''}
      <p class="note">For a long (buy) trade entered at the last price. Stop distance = 1.5 × ATR(14) on 5-minute candles. Stop loss = entry − stop distance. Position size = max risk ÷ stop distance, rounded down to whole shares. Target = entry + 2 × stop distance, which gives risk : reward of 1 : 2. Set the max risk in the box at the top of the page. These numbers move with the price and ATR, and ignore brokerage, taxes and slippage; a real fill at the stop can be worse than the stop price.</p>
    </div>`;
  const tpl = document.createElement('template');
  tpl.innerHTML = full;
  const header = `
    <h2>${esc(short(selected))}</h2>
    <div class="price num">₹${fmt(price, r.ltp)} <span class="${chg >= 0 ? 'up' : 'down'}">${chg == null ? '' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%'}</span></div>`;

  const section = view && tpl.content.getElementById(view);
  if (section) {
    // Detail view of one section.
    const chips = SECTIONS.map(([id, title]) => `<a href="#${id}" ${id === view ? 'aria-current="page"' : ''}>${title}</a>`).join('');
    el.innerHTML = `<a class="back" href="#">← All metrics</a>${header}<div class="jump">${chips}</div>${section.outerHTML}`;
    return;
  }
  // Overview: one tile per calculation. Each opens the section that calculation belongs to.
  const tone = (v) => (v == null ? '' : v >= 0 ? 'up' : 'down');
  const rupee = (v) => (v == null ? '–' : '₹' + price.format(v));
  const pct = (v, d = 2) => (v == null ? '–' : signed(v, d) + '%');
  const level = (lv) => (lv ? { value: rupee(lv.price), sub: (lv.name ? lv.name + ' · ' : '') + signed(lv.distancePct) + '% away' + (lv.broken ? ' · broken' : '') } : { value: '–', sub: '' });
  const pivS = level(r.support), pivR = level(r.resistance), swS = level(r.swingLow), swR = level(r.swingHigh);
  const TILES = [
    ['s-volume', 'RVOL', fmtRvol(r.rvol), '', r.rvol == null ? 'starts at 09:15 IST' : 'base 1× = usual · below 1 quieter · above 1 busier · never below 0', `RVOL = volume so far today ÷ average volume by the same time of day over the last 20 sessions`, rate('rvol', r.rvol)],
    ['s-vwap', 'VWAP', rupee(r.vwap), '', 'average price traded today', `VWAP = Σ(price × volume) ÷ Σ(volume) for today's trades (taken from the exchange feed)`],
    ['s-vwap', 'VWAP deviation', pct(r.vwapDevPct), tone(r.vwapDevPct), r.vwap == null ? '' : signed(r.ltp - r.vwap) + ' ₹ from VWAP', `VWAP deviation % = (last price − VWAP) ÷ VWAP × 100`],
    ['s-vwap', 'Normalized VWAP deviation', fmtAtr(r.vwapDevAtr), tone(r.vwapDevAtr), 'base 0 = at VWAP · &lt; 0 below VWAP · &gt; 0 above VWAP', `Normalized VWAP deviation = (last price − VWAP) ÷ ATR(14) on 5-minute candles`, rateVwapDev(r.vwapDevAtr)],
    ['s-volatility', 'True range', rupee(r.tr5), '', 'last 5-min candle', `True range = max(high − low, |high − previous close|, |low − previous close|) of the last completed 5-minute candle`],
    ['s-volatility', 'ATR', rupee(r.atr5), '', '14 candles, 5-min', `ATR = Wilder average of true range over 14 five-minute candles: ATR = (previous ATR × 13 + true range) ÷ 14`],
    ['s-volatility', 'ATR %', r.atrPct == null ? '–' : r.atrPct.toFixed(3) + '%', '', 'ATR as a share of price', `ATR % = ATR ÷ last price × 100`],
    ['s-volatility', 'Relative ATR', r.relAtr == null ? '–' : r.relAtr.toFixed(2) + '×', '', '+ve value · 1× = usual for this time', `Relative ATR = current ATR ÷ average ATR at the same time of day over the last 20 sessions`, rate('relAtr', r.relAtr)],
    ['s-momentum', 'Rate of change', pct(r.roc), tone(r.roc), 'over 10 candles (50 min)', `ROC % = (close now − close 10 candles ago) ÷ close 10 candles ago × 100`],
    ['s-momentum', 'RSI', r.rsi == null ? '–' : r.rsi.toFixed(1), '', 'base 50 · below 50 bearish · above 50 bullish · range 0 to 100', `RSI = 100 − 100 ÷ (1 + average gain ÷ average loss), Wilder averages over 14 five-minute closes`, rate('rsi', r.rsi)],
    ['s-trend', 'EMA 20', rupee(r.ema), '', r.priceVsEmaPct == null ? '' : 'price ' + signed(r.priceVsEmaPct) + '% vs EMA', `EMA = close × k + previous EMA × (1 − k), with k = 2 ÷ (20 + 1), on 5-minute closes`],
    ['s-trend', 'EMA slope %', pct(r.emaSlopePct, 3), tone(r.emaSlopePct), 'change in EMA over 5 candles', `EMA slope % = (EMA now − EMA 5 candles ago) ÷ EMA 5 candles ago × 100`],
    ['s-trend', 'Normalized EMA slope %', pct(emaSlopePerCandle(r), 4), tone(r.emaSlopePct), 'EMA slope ÷ 5 candles = change per candle', `Normalized EMA slope % = EMA slope % ÷ number of candles (5)`, rateEmaSlope(emaSlopePerCandle(r))],
    ['s-book', 'Spread %', r.spreadPct == null ? '–' : r.spreadPct.toFixed(4) + '%', '', r.spread == null ? (r.book && !r.bookLive ? 'market closed' : 'never below 0 · usually below 0.2%') : '₹' + price.format(r.spread) + ' bid to ask · never below 0 · usually below 0.2%', `Spread % = (best ask − best bid) ÷ ((best ask + best bid) ÷ 2) × 100`, rate('spreadPct', r.spreadPct)],
    ['s-book', 'Order book imbalance', signed(r.imbalance5), tone(r.imbalance5), r.book && !r.bookLive ? 'market closed · leftover book' : 'top 5 levels, −1 to +1', `Imbalance = (bid quantity − ask quantity) ÷ (bid quantity + ask quantity), over the top 5 levels`, r.bookLive ? rate('imbalance', r.imbalance5) : null],
    ['s-levels', 'Nearest support (pivot)', pivS.value, '', pivS.sub, `Pivot = (prev high + prev low + prev close) ÷ 3. S1 = 2 × pivot − high, S2 = pivot − (high − low), S3 = low − 2 × (high − pivot). Shown: the closest level at or below the price`],
    ['s-levels', 'Nearest resistance (pivot)', pivR.value, '', pivR.sub, `Pivot = (prev high + prev low + prev close) ÷ 3. R1 = 2 × pivot − low, R2 = pivot + (high − low), R3 = high + 2 × (pivot − low). Shown: the closest level above the price`],
    ['s-swings', 'Nearest support (swing)', swS.value, '', swS.sub, `Last swing low = low of the most recent 5-minute candle whose low is the lowest of 5 candles (itself and 2 on each side)`],
    ['s-swings', 'Nearest resistance (swing)', swR.value, '', swR.sub, `Last swing high = high of the most recent 5-minute candle whose high is the highest of 5 candles (itself and 2 on each side)`],
    ['s-exec', 'Stop distance', plan ? rupee(plan.stopDistance) : '–', '', '1.5 × ATR', `Stop distance = 1.5 × ATR(14) on 5-minute candles`],
    ['s-exec', 'Stop loss', plan ? rupee(plan.stopLoss) : '–', '', plan ? 'for entry at ' + rupee(plan.entry) : '', `Stop loss = entry price − stop distance`],
    ['s-exec', 'Position size', plan ? qty.format(plan.qty) + ' shares' : '–', '', plan ? 'needs ₹' + qty.format(Math.round(plan.capital)) + ' · risk ₹' + qty.format(maxRisk) : '', `Position size = maximum risk ÷ stop distance`],
    ['s-exec', 'Target price', plan ? rupee(plan.target) : '–', '', 'risk : reward 1 : 2', `Target price = entry price + 2 × stop distance`],
  ];
  tileInfo = TILES.map(([, title, , , , formula]) => ({ title, formula }));
  // One group per section: a heading, then that section's tiles on their own row(s).
  const tile = ([id, title, value, cls, sub, , rating], n) => `<a class="tile ${rating ? 'rated ' + rating.grade : ''}" href="#${id}">
      <div class="tile-title">${title}<span class="info" data-n="${n}" role="button" aria-label="Show the formula for ${title}">i</span></div>
      <div class="tile-value ${cls}">${value}</div>
      <div class="tile-label">${sub || '&nbsp;'}</div>
      ${rating ? `<div class="tile-rating">${badge(rating)}</div>` : ''}
    </a>`;
  const groups = SECTIONS.map(([id, name]) => `<section class="group">
      <h3 class="group-title"><a href="#${id}">${name}<span aria-hidden="true"> →</span></a></h3>
      <div class="tiles">${TILES.map((t, n) => (t[0] === id ? tile(t, n) : '')).join('')}</div>
    </section>`).join('');
  el.innerHTML = `${header}${groups}`;
  if (tipFor != null) el.querySelector(`.info[data-n="${tipFor}"]`)?.classList.add('on');
}

async function loadCurves(sym) {
  try {
    const res = await fetch('/api/detail?sym=' + encodeURIComponent(sym));
    if (!res.ok) return;
    const d = await res.json();
    if (sym === selected) { curves = { sym, average: d.average, today: d.today, price: d.price, vwapCurve: d.vwapCurve, trCurve: d.trCurve, atrCurve: d.atrCurve, atrUsualCurve: d.atrUsualCurve, rocCurve: d.rocCurve, rsiCurve: d.rsiCurve, emaCurve: d.emaCurve, slopeCurve: d.slopeCurve }; renderDetail(); }
  } catch { /* server down; the socket status already says so */ }
}

function select(sym) {
  selected = sym;
  remember('stock', sym);
  curves = null;
  renderList();
  renderDetail();
  loadCurves(sym);
}

function applyRow(r) {
  const prev = rows.get(r.sym);
  rows.set(r.sym, r);
  // Keep the chart's live point current, and reload the curves when the session day changes.
  if (r.sym === selected && curves?.today && r.volume != null && r.asOf) {
    if (prev?.asOf && istDay(prev.asOf) !== istDay(r.asOf)) { loadCurves(r.sym); return; }
    const d = new Date(r.asOf + 19800000);
    const idx = Math.floor((d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds() - 33300) / 60);
    if (idx >= 0) {
      const i = Math.min(idx, 374);
      curves.today[i] = r.volume;
      if (curves.price && r.ltp != null) curves.price[i] = r.ltp;
      if (curves.vwapCurve && r.vwap) curves.vwapCurve[i] = r.vwap;
    }
  }
}

// Max risk per trade: lives in the header (outside the redrawn panel) and is remembered.
$('max-risk').value = maxRisk;
$('max-risk').addEventListener('input', (e) => {
  const v = Number(e.target.value);
  if (!(v > 0)) return; // ignore empty or invalid input while typing
  maxRisk = v;
  try { localStorage.setItem('maxRisk', String(v)); } catch { /* storage unavailable */ }
  schedule();
});

// Stock list open/closed, remembered across refreshes.
function setSidebar(open) {
  document.querySelector('main').classList.toggle('closed', !open);
  $('toggle').setAttribute('aria-expanded', String(open));
  $('toggle-text').textContent = open ? 'Hide stocks' : 'Show stocks';
  try { localStorage.setItem('sidebarOpen', open ? '1' : '0'); } catch { /* storage unavailable */ }
  if (typeof schedule === 'function') schedule();
}
$('toggle').addEventListener('click', () => setSidebar(document.querySelector('main').classList.contains('closed')));
try { if (localStorage.getItem('sidebarOpen') === '0') setSidebar(false); } catch { /* storage unavailable */ }

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-sym]');
  if (b) select(b.dataset.sym);
});

// One tooltip for all info icons. It lives outside the tiles, which are redrawn on every quote,
// so it stays put while the numbers behind it change.
let tileInfo = [];
let tipFor = null;
function formulaHtml(text) {
  // "A = B. C = D. Shown: note" -> one equation box per equation, then the note.
  const parts = text.split(/\.\s+(?=[A-Z])/);
  let html = '';
  for (const part of parts) {
    // "R1 = …, R2 = …" -> one box each. Other commas (such as "…, with k = …") stay in one box.
    const pieces = part.split(/,\s(?=[A-Z]\d?\s=)/);
    if (pieces.length > 1) { html += pieces.map((x) => formulaHtml(x)).join(''); continue; }
    const eq = part.match(/^(.+?)\s=\s(.+)$/);
    if (eq) html += `<div class="tt-eq"><b>${eq[1]}</b> = ${eq[2].replace(/\.$/, '')}</div>`;
    else html += `<div class="tt-note">${part.replace(/^Shown:\s*/, '')}</div>`;
  }
  return html;
}
function showTip(icon) {
  const n = Number(icon.dataset.n);
  const info = tileInfo[n];
  const tip = $('tooltip');
  if (!info) return;
  if (tipFor !== n) {
    tip.innerHTML = `<div class="tt-kicker">How it's calculated</div><div class="tt-title">${info.title}</div>${formulaHtml(info.formula)}`;
    tipFor = n;
  }
  // Above the icon, right-aligned to it; dropped below only when there is no room above.
  const a = icon.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight, gap = 10;
  const left = Math.max(12, Math.min(a.right + 14 - w, window.innerWidth - w - 12));
  const above = a.top - gap - h > 8 || a.bottom + gap + h > window.innerHeight - 8;
  tip.style.left = left + 'px';
  tip.style.top = (above ? a.top - gap - h : a.bottom + gap) + 'px';
  tip.style.setProperty('--arrow-x', (a.left + a.width / 2 - left) + 'px');
  tip.classList.toggle('above', above);
  tip.classList.add('show');
}
function hideTip() {
  if (tipFor == null) return;
  tipFor = null;
  $('tooltip').classList.remove('show');
  document.querySelector('.info.on')?.classList.remove('on');
}
// Click the icon to open its tooltip; click it again, click anywhere else, or press Escape to close.
document.addEventListener('click', (e) => {
  const icon = e.target.closest?.('.info');
  if (!icon) { hideTip(); return; }
  e.preventDefault(); // the icon sits inside the tile link: don't navigate
  if (tipFor === Number(icon.dataset.n)) hideTip(); else showTip(icon);
  schedule();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('resize', hideTip);

// ---------- touch only (phones and tablets); mouse clicks never run this ----------
// The panel is redrawn on every quote. On a touch screen the browser sends the click a moment
// after the finger lifts, aimed at the element that was first touched; by then a redraw has
// usually replaced that element, so the tap is lost (or, on iOS, treated as a hover). So a
// finger tap is handled here directly: find what is under the finger now and act on it.
let touchStart = null;
let suppressClickUntil = 0;
function handleTap(el) {
  if (!el) return false;
  const icon = el.closest('.info');
  if (icon) {
    if (tipFor === Number(icon.dataset.n)) hideTip(); else showTip(icon);
    schedule();
    return true;
  }
  const stock = el.closest('#list button[data-sym]');
  if (stock) { hideTip(); select(stock.dataset.sym); return true; }
  const link = el.closest('#detail a[href^="#"]');
  if (link) {
    hideTip();
    const target = link.getAttribute('href');
    if (location.hash !== target && !(target === '#' && !location.hash)) location.hash = target; // fires hashchange
    return true;
  }
  hideTip();
  return false; // inputs and everything else behave normally
}
window.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') touchStart = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
}, true);
window.addEventListener('pointercancel', () => { touchStart = null; }, true); // the touch became a scroll
window.addEventListener('pointerup', (e) => {
  if (e.pointerType !== 'touch' || !touchStart || e.pointerId !== touchStart.id) return;
  const moved = Math.hypot(e.clientX - touchStart.x, e.clientY - touchStart.y);
  const held = performance.now() - touchStart.t;
  touchStart = null;
  if (moved > 10 || held > 600) return; // a swipe or a long press, not a tap
  if (handleTap(document.elementFromPoint(e.clientX, e.clientY))) suppressClickUntil = performance.now() + 700;
}, true);
// The browser's own follow-up click for a tap we already handled is dropped, so nothing fires twice.
document.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

// Redraws replace the elements under the pointer; one landing between press and release would
// swallow the click. So drawing waits while a mouse button or finger is down.
let pointerDown = false;
window.addEventListener('pointerdown', () => { pointerDown = true; });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, () => { pointerDown = false; schedule(); });

// Tiles and the back link are plain #links, so the browser's back button works between views.
window.addEventListener('hashchange', () => { hideTip(); view = viewFromHash(); remember('view', view); window.scrollTo(0, 0); schedule(); });

var dirty = false; // var: schedule() can be called before this line runs (restoring a closed sidebar)
function schedule() {
  if (dirty) return;
  dirty = true;
  requestAnimationFrame(() => {
    dirty = false;
    if (pointerDown) return; // redrawn on release
    renderStatus();
    renderList();
    try {
      renderDetail();
    } catch (err) {
      // Usually the page is newer than the running server, so fields it expects are missing.
      console.error(err);
      $('detail').innerHTML = '<p class="empty">This page is newer than the running dashboard server.<br>Stop the server (Ctrl+C) and start it again with <b>npm run dashboard</b>, then refresh.</p>';
    }
  });
}

let retry = 1000;
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { socketUp = true; retry = 1000; schedule(); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'snapshot') {
      order = msg.rows.map((r) => r.sym);
      msg.rows.forEach((r) => rows.set(r.sym, r));
      feed = msg.status;
      if (!selected || !order.includes(selected)) select(order.includes(recall('stock')) ? recall('stock') : order[0]); else loadCurves(selected);
    } else if (msg.type === 'row') {
      applyRow(msg.row);
    } else if (msg.type === 'curves') {
      if (selected) loadCurves(selected);
    } else if (msg.type === 'status') {
      feed = msg.status;
    }
    schedule();
  };
  ws.onclose = () => { socketUp = false; schedule(); setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
}
connect();
// Keep --header-h equal to the header's real height, so the pinned stock list sits just below it.
const setHeaderHeight = () => document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
setHeaderHeight();
new ResizeObserver(setHeaderHeight).observe(document.querySelector('header'));
setInterval(renderStatus, 5000);
window.addEventListener('resize', schedule);
</script>
</body>
</html>
